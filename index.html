<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PES 2021 · Football's Coming Home</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oswald,sans-serif;
    background:#0a0f0a;
    color:#f0f8f0;
    min-height:100vh;
    font-size:16px;line-height:1.5
  }
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-track{background:#0a0f0a}
  ::-webkit-scrollbar-thumb{background:#2e7d32;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#4caf50}

  .pitch-line{
    position:fixed;top:0;left:0;right:0;bottom:0;
    pointer-events:none;z-index:0;
    background:
      repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(46,125,50,.08) 39px,rgba(46,125,50,.08) 40px);
  }

  .stadium-glow{
    position:fixed;top:-30%;left:-30%;width:160%;height:160%;
    pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 50% 0%,rgba(59,130,246,.015) 0%,transparent 60%);
  }

  .container{max-width:1260px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

  header{
    border-bottom:2px solid #1e2a1e;margin-bottom:28px;
    position:relative
  }
  header::after{
    content:'';position:absolute;bottom:-2px;left:10%;right:10%;
    height:1px;background:linear-gradient(90deg,transparent,rgba(59,130,246,.15),transparent)
  }
  .header-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:24px 0;flex-wrap:wrap;gap:16px
  }
  .header-left{display:flex;align-items:center;gap:12px}
  .header-left h1{
    font-size:1.8rem;font-weight:800;
    background:linear-gradient(135deg,#f0f8f0,#3b82f6);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    letter-spacing:-.5px
  }
  .header-left .ball{font-size:1.8rem}
  .search-group{display:flex;flex-direction:column;gap:8px;flex:1;max-width:540px;min-width:260px}
  .search-row{display:flex;gap:8px;align-items:stretch}
  .search-box{
    position:relative;flex:1;min-width:0
  }
  .search-filter-bar{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    padding:6px 4px;min-height:0;overflow:hidden;
    transition:all .2s
  }
  .search-filter-bar .sf-group{
    display:flex;align-items:center;gap:6px;font-size:.78rem
  }
  .search-filter-bar .sf-group label{
    color:#5a7a5a;text-transform:uppercase;letter-spacing:.5px;font-size:.65rem;font-weight:600
  }
  .search-filter-bar select{
    font-size:.75rem;padding:5px 8px;min-width:90px;background:#141914;border-color:#2a3a2a;border-width:2px;border-radius:8px
  }
  .search-filter-bar .sf-count{
    color:#4a5a4a;font-size:.7rem;margin-left:auto;font-family:monospace;white-space:nowrap;font-weight:500
  }
  .search-filter-bar .sf-skill-tag{
    background:#1e2a1e;border:1px solid #3b82f6;border-radius:5px;padding:3px 8px;font-size:.68rem;color:#3b82f6;
    display:inline-flex;align-items:center;gap:4px;font-weight:600
  }
  .search-filter-bar .sf-skill-clear{
    background:none;border:none;color:#6a8a6a;cursor:pointer;font-size:.75rem;padding:0 3px;font-family:inherit
  }
  .search-filter-bar .sf-skill-clear:hover{color:#f0f8f0}
  .search-box input{
    width:100%;
    background:#141914;border:2px solid #2a3a2a;border-radius:10px;
    padding:11px 16px 11px 38px;color:#f0f8f0;font-size:.9rem;outline:none;
    transition:border-color .2s,box-shadow .2s
  }
  .search-box input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
  .search-box input::placeholder{color:#4a5a4a}
  .search-box .s-icon{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    color:#4a5a4a;font-size:.95rem;pointer-events:none
  }
  .search-results{
    position:absolute;top:100%;left:0;right:0;z-index:500;
    background:#161e16;border:2px solid #2a3a2a;border-radius:10px;
    margin-top:6px;max-height:420px;overflow-y:auto;display:none;
    box-shadow:0 12px 40px rgba(0,0,0,.7)
  }
  .search-results.open{display:block}
  .search-result-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;cursor:pointer;transition:background .15s;
    border-bottom:1px solid #1e2a1e;font-size:.85rem
  }
  .search-result-item:last-child{border-bottom:none}
  .search-result-item:hover{background:#1a261a}
  .search-result-item .sr-name{color:#f0f8f0;font-weight:600;min-width:0;font-size:.88rem}
  .search-result-item .sr-ovr{
    font-family:monospace;color:#f0f8f0;font-weight:700;font-size:.95rem;width:38px;text-align:right;flex-shrink:0
  }
  .search-result-item .sr-pos{
    color:#7a9a7a;font-size:.75rem;width:34px;flex-shrink:0;text-align:center;
    background:#0a0f0a;border-radius:4px;padding:0 5px;font-weight:500
  }
  .search-result-item .sr-team{
    color:#7a9a7a;font-size:.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    flex:1;min-width:0;margin:0 4px;font-style:italic
  }
  .search-result-item .sr-foot{
    width:16px;flex-shrink:0;text-align:center;font-size:.78rem;opacity:.7
  }

  .controls{
    background:#141914;border-radius:14px;padding:24px;margin-bottom:24px;
    border:2px solid #1e2a1e
  }
  .controls-row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end}
  .control-group{flex:1;min-width:170px}
  .control-group label{
    display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:1px;
    color:#5a7a5a;margin-bottom:6px;font-weight:600
  }
  .patch-checkboxes{display:flex;flex-direction:column;gap:6px}
  .patch-checkboxes label{
    display:flex;align-items:center;gap:10px;cursor:pointer;
    font-size:.88rem;text-transform:none;letter-spacing:0;color:#c8d8c8
  }
  .patch-checkboxes input[type=checkbox]{width:17px;height:17px;accent-color:#3b82f6;cursor:pointer}
  .patch-checkboxes .count{color:#4a5a4a;font-size:.75rem}
  select{
    background:#1a221a;border:2px solid #2a3a2a;border-radius:10px;
    padding:11px 14px;color:#f0f8f0;font-size:.95rem;outline:none;cursor:pointer;
    min-width:110px;transition:border-color .2s,box-shadow .2s;
    font-weight:500
  }
  select:hover{border-color:#4a6a4a}
  select:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
  select option{background:#1a221a;color:#f0f8f0;padding:6px}
  .stars{color:#e8f0e8}

  input[type=number]{
    background:#1a221a;border:2px solid #2a3a2a;border-radius:10px;
    padding:11px 14px;color:#f0f8f0;font-size:.95rem;width:80px;outline:none;
    transition:border-color .2s;font-weight:500
  }
  input[type=number]:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
  input[type=number]:hover{border-color:#4a6a4a}

  .btn{
    padding:11px 28px;border:none;border-radius:10px;font-size:1rem;font-weight:700;
    cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:10px;
    font-family:inherit;letter-spacing:.3px
  }
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn-primary{
    background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#f0f8f0;
    box-shadow:0 4px 16px rgba(59,130,246,.2);font-size:1.05rem;padding:12px 32px
  }
  .btn-primary:hover:not(:disabled){
    transform:translateY(-2px);box-shadow:0 6px 28px rgba(59,130,246,.35)
  }
  .btn-primary:active:not(:disabled){transform:translateY(0)}
  .btn-secondary{
    background:#1e2a1e;color:#c8d8c8;border:2px solid #2a3a2a
  }
  .btn-secondary:hover:not(:disabled){background:#2a3a2a;color:#f0f8f0;border-color:#3a5a3a}
  .btn-group{display:flex;gap:10px;align-items:flex-end}

  .results{
    background:#141914;border-radius:14px;padding:24px;margin-bottom:24px;
    border:2px solid #1e2a1e;min-height:120px
  }
  .results h2{
    font-size:.8rem;text-transform:uppercase;letter-spacing:1.5px;color:#5a7a5a;margin-bottom:14px;font-weight:600
  }
  .results-empty{
    color:#4a5a4a;text-align:center;padding:30px 0;font-style:italic;font-size:.9rem
  }
  .results-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px
  }
  .result-card{
    background:#0a0f0a;border-radius:10px;padding:16px 18px;cursor:pointer;
    transition:all .25s;position:relative;overflow:hidden;
    animation:fadeInUp .4s ease both;
    border-left:4px solid #3b82f6;border-top:1px solid #1a221a;border-bottom:1px solid #1a221a;border-right:1px solid #1a221a
  }
  .result-card:nth-child(1){animation-delay:0s}
  .result-card:nth-child(2){animation-delay:.08s}
  .result-card:nth-child(3){animation-delay:.16s}
  .result-card:nth-child(4){animation-delay:.24s}
  .result-card:nth-child(5){animation-delay:.32s}
  .result-card:nth-child(6){animation-delay:.4s}
  .result-card:nth-child(7){animation-delay:.48s}
  .result-card:nth-child(8){animation-delay:.56s}
  .result-card:nth-child(9){animation-delay:.64s}
  .result-card:nth-child(10){animation-delay:.72s}
  .result-card:hover{
    transform:translateY(-3px);box-shadow:0 8px 30px rgba(59,130,246,.15);
    border-left-color:#3b82f6;border-color:#2a3a2a
  }
  .result-card .team-name{
    font-size:1.05rem;font-weight:700;color:#f0f8f0;display:flex;align-items:center;gap:8px
  }
  .result-card .team-patch{font-size:.78rem;color:#6a8a6a;margin-top:4px}
  .result-card .team-number{
    position:absolute;top:10px;right:12px;
    font-family:monospace;font-size:.7rem;color:#2a3a2a
  }

  .team-lists{margin-top:28px}
  .patch-section{
    background:#141914;border-radius:12px;margin-bottom:12px;
    border:2px solid #1e2a1e;overflow:hidden
  }
  .patch-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;cursor:pointer;user-select:none;transition:background .2s
  }
  .patch-header:hover{background:#161e16}
  .patch-header h3{font-size:1rem;font-weight:700;color:#c8d8c8}
  .patch-header .meta{display:flex;align-items:center;gap:12px}
  .patch-header .count-badge{
    background:#0a0f0a;padding:3px 10px;border-radius:20px;font-size:.75rem;color:#6a8a6a;border:1px solid #1e2a1e
  }
  .patch-header .toggle-icon{color:#3a5a3a;font-size:1.2rem;transition:transform .2s}
  .patch-header .toggle-icon.open{transform:rotate(180deg)}
  .team-grid{display:none;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;padding:0 20px 16px}
  .team-grid.open{display:grid}
  .team-item{
    padding:6px 10px;border-radius:6px;font-size:.82rem;color:#8a9a8a;
    transition:all .15s;cursor:pointer;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;font-weight:500
  }
  .team-item:hover{background:#1a261a;color:#c8d8c8}
  .team-item.drawn{color:#3a4a3a;text-decoration:line-through}
  .team-item.drawn::after{content:" \2713";color:#2e7d32}

  @keyframes fadeInUp{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
  }

  .spin-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;
    z-index:1000;opacity:0;pointer-events:none;transition:opacity .4s
  }
  .spin-overlay.active{opacity:1;pointer-events:all}
  .spin-overlay .spotlight{
    position:fixed;top:50%;left:50%;width:700px;height:700px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(59,130,246,.08) 0%,transparent 70%);
    pointer-events:none;border-radius:50%
  }
  .spin-box{
    background:#0a0f0a;border:2px solid #1e2a1e;
    border-radius:20px;padding:40px 56px;
    text-align:center;max-width:90vw;position:relative;
    box-shadow:0 0 60px rgba(0,0,0,.5)
  }
  .spin-box .spinning-label{
    color:#5a7a5a;font-size:.85rem;text-transform:uppercase;letter-spacing:3px;
    font-family:monospace;font-weight:600
  }
  .spin-box .spinning-name{
    font-size:2.4rem;font-weight:800;min-height:2em;
    display:flex;align-items:center;justify-content:center;
    color:#f0f8f0;margin:20px 0;transition:all .3s;
    font-family:Oswald,'Segoe UI',sans-serif;letter-spacing:2px
  }
  .spin-box .spinning-name.blur{filter:blur(6px);opacity:.5;color:#9aa99a}
  .spin-box .spinning-name.reveal{
    filter:blur(0);opacity:1;color:#f0f8f0;transform:scale(1);
    text-shadow:0 0 60px rgba(59,130,246,.3),0 0 120px rgba(59,130,246,.1);
    animation:glowPulse 1.2s ease infinite
  }
  @keyframes glowPulse{
    0%,100%{text-shadow:0 0 60px rgba(59,130,246,.3),0 0 120px rgba(59,130,246,.1)}
    50%{text-shadow:0 0 80px rgba(59,130,246,.5),0 0 160px rgba(59,130,246,.2)}
  }
  .spin-box .spinning-name.shake{
    animation:shake .1s ease infinite
  }
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-3px)}
    75%{transform:translateX(3px)}
  }
  .spin-box .spinning-count{
    font-size:.8rem;color:#3a5a3a;font-family:monospace;margin-top:6px
  }
  .spin-box .draw-step{
    display:inline-block;width:12px;height:12px;border-radius:50%;
    background:#1e2a1e;margin:0 4px;transition:all .3s
  }
  .spin-box .draw-step.active{background:#3b82f6;box-shadow:0 0 14px rgba(59,130,246,.6)}
  .spin-box .draw-step.done{background:#2e7d32;box-shadow:0 0 8px rgba(46,125,50,.4)}

  .team-panel-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.8);z-index:900;
    display:none;justify-content:flex-end;backdrop-filter:blur(4px)
  }
  .team-panel-overlay.active{display:flex}
  .team-panel{
    width:640px;max-width:96vw;
    background:#141914;border-left:2px solid #1e2a1e;
    height:100vh;overflow-y:auto;padding:0;
    animation:slideIn .3s ease
  }
  @keyframes slideIn{
    from{transform:translateX(100%);opacity:0}
    to{transform:translateX(0);opacity:1}
  }
  .panel-close{
    position:sticky;top:12px;float:right;margin:14px;
    background:#1e2a1e;border:none;color:#7a8a7a;
    width:30px;height:30px;border-radius:50%;font-size:1.1rem;
    cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;
    transition:all .2s
  }
  .panel-close:hover{background:#2a3a2a;color:#f0f8f0}

  .player-modal-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.85);z-index:1000;
    display:none;align-items:center;justify-content:center;
    backdrop-filter:blur(5px)
  }
  .player-modal-overlay.active{display:flex}
  .player-modal{
    width:560px;max-width:94vw;max-height:90vh;
    background:#141914;border:2px solid #2a3a2a;border-radius:18px;
    padding:0;overflow-y:auto;
    animation:fadeInUp .3s ease;position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.6)
  }
  .player-modal .pm-content{padding:20px 24px 24px}
  .player-modal .pm-header{
    display:flex;align-items:center;gap:16px;
    padding:20px 24px 0;margin-bottom:16px
  }
  .player-modal .pm-header .pm-name{font-size:1.3rem;font-weight:700;color:#f0f8f0}
  .player-modal .pm-header .pm-name .wiki-link{color:#3b82f6;text-decoration:none;font-size:.85rem;margin-left:4px;opacity:.5;transition:opacity .15s}
  .player-modal .pm-header .pm-name .wiki-link:hover{opacity:1}
  .player-modal .pm-header .pm-pos{
    background:#1e2a1e;border-radius:6px;padding:3px 10px;
    font-size:.75rem;font-weight:700;color:#8a9a8a;text-transform:uppercase
  }
  .player-modal .pm-header .pm-pos-sec{color:#5a7a5a;font-weight:400;margin-left:4px;text-transform:none}
  .player-modal .pm-header .pm-ovr{
    margin-left:auto;font-size:2rem;font-weight:800;
    color:#f0f8f0;line-height:1
  }
  .player-modal .pm-meta{
    display:flex;flex-wrap:wrap;gap:4px 16px;
    padding:0 24px;margin-bottom:14px;
    font-size:.78rem;color:#6a8a6a
  }
  .player-modal .pm-meta span{white-space:nowrap}
  .player-modal .wf-visual{display:inline-flex;align-items:center;gap:4px;cursor:default}
  .player-modal .wf-foot-icon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:.6rem;font-weight:800;color:#0a0f0a}
  .player-modal .wf-foot-label{font-size:.72rem;font-weight:600;color:#b0c0b0}
  .player-modal .pm-chart-area{
    background:#0a0f0a;border-radius:12px;border:1px solid #1e2a1e;
    padding:16px;margin:0 24px 14px;display:flex;justify-content:center
  }
  .player-modal .pm-chart-area canvas{max-width:100%;max-height:320px}
  .player-modal .pm-skills{
    padding:0 24px 8px;display:flex;flex-wrap:wrap;gap:5px
  }
  .player-modal .pm-skills .skill-tag{
    background:linear-gradient(135deg,#1a2a1a,#0f1f0f);border:1px solid #3b82f6;
    border-radius:6px;padding:5px 12px;font-size:.78rem;color:#3b82f6;
    font-weight:600;display:inline-flex;align-items:center;gap:4px;
    box-shadow:0 0 6px rgba(59,130,246,.1);transition:all .15s
  }
  .player-modal .pm-skills .skill-tag::before{content:'★';font-size:.6rem;color:#3b82f6;opacity:.5}
  .player-modal .pm-skills .skill-tag:hover{background:linear-gradient(135deg,#2a3a2a,#1a2a1a);box-shadow:0 0 10px rgba(59,130,246,.2)}
  .player-modal .pm-stat-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;
    padding:0 24px 14px
  }
  .player-modal .pm-stat-row{
    display:flex;align-items:center;gap:8px;
    font-size:.78rem
  }
  .player-modal .pm-stat-row .pm-slabel{
    width:80px;flex-shrink:0;color:#7a8a7a;text-align:right;font-size:.7rem;font-weight:500
  }
  .player-modal .pm-stat-row .pm-strack{
    flex:1;height:6px;background:#0a0f0a;border-radius:3px;overflow:hidden
  }
  .player-modal .pm-stat-row .pm-strack .pm-sfill{
    height:100%;border-radius:3px;transition:width .4s ease
  }
  .player-modal .pm-stat-row .pm-sfill.cat-phy{background:linear-gradient(90deg,#c0392b,#e74c3c)}
  .player-modal .pm-stat-row .pm-sfill.cat-tec{background:linear-gradient(90deg,#2980b9,#3498db)}
  .player-modal .pm-stat-row .pm-sfill.cat-men{background:linear-gradient(90deg,#6366f1,#818cf8)}
  .player-modal .pm-stat-row .pm-sfill.cat-gk{background:linear-gradient(90deg,#27ae60,#2ecc71)}
  .player-modal .pm-stat-grid.gk-mode{grid-template-columns:1fr 1fr 1fr}
  .player-modal .pm-stat-row .pm-sval{width:22px;text-align:right;font-weight:600;color:#f0f8f0;font-size:.72rem}
  @keyframes fadeInUp{
    from{opacity:0;transform:translateY(20px) scale(.96)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  .panel-card{
    background:#0a0f0a;border-radius:12px;margin:0 20px 14px;
    border:1px solid #1e2a1e;padding:18px
  }
  .panel-card:first-of-type{margin-top:14px}
  .panel-card h3{
    font-size:.75rem;text-transform:uppercase;letter-spacing:1px;
    color:#5a7a5a;margin-bottom:12px;font-weight:600
  }
  .panel-header-info{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:8px
  }
  .panel-header-info h2{
    font-size:1.4rem;color:#f0f8f0;display:flex;align-items:center;gap:8px
  }
  .panel-header-info .ovr-big{
    font-family:monospace;font-size:2.4rem;font-weight:700;color:#f0f8f0;
    line-height:1;text-shadow:0 0 20px rgba(59,130,246,.15)
  }
  .panel-meta{
    display:flex;flex-wrap:wrap;gap:10px;font-size:.82rem;color:#6a8a6a
  }
  .panel-meta span{
    background:#141914;padding:3px 10px;border-radius:5px;border:1px solid #1a221a;font-weight:500

<body>
<div class="pitch-line"></div>
<div class="stadium-glow"></div>
<div class="container">
  <header>
    <div class="header-row">
      <div class="header-left">
        <span class="ball">⚽</span>
        <h1>PES 2021 · Football's Coming Home</h1>
      </div>
      <div class="search-group">
        <div class="search-row">
          <div class="search-box" id="searchBox">
            <span class="s-icon">&#x1F50D;</span>
            <input type="text" id="searchInput" placeholder="Cerca jugador per nom..." autocomplete="off">
            <div class="search-results" id="searchResults"></div>

          <button class="skill-glossary-btn" onclick="toggleControls()">&#x1F3AE; Controls</button>
        </div>

          <div class="sf-group">
            <label>Posició</label>
            <div class="pos-tags" id="searchPosArea"></div>
          </div>

            <label>Patch</label>

          </div>

            <label>Peu</label>

let audioCtx=null;
function getAudioCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

// Brass-like note with attack/decay envelope
function playBrass(t,freq,dur,vol){
  const ctx=getAudioCtx();
  const o=ctx.createOscillator();const g=ctx.createGain();
  o.type='triangle';
  o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.025);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(ctx.destination);
  o.start(t);o.stop(t+dur);
}

// Low rumble (like orchestral timpani/low strings)
function playRumble(t,dur,vol){
  const ctx=getAudioCtx();
  const o=ctx.createOscillator();const g=ctx.createGain();
  o.type='sawtooth';
  o.frequency.value=55;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+dur*0.3);
  g.gain.linearRampToValueAtTime(0,t+dur);
  const f=ctx.createBiquadFilter();
  f.type='lowpass';f.frequency.value=200;
  o.connect(f);f.connect(g);g.connect(ctx.destination);
  o.start(t);o.stop(t+dur);
}

// "Drum hit" — timpani-like thump
function playTimpani(t,vol){
  const ctx=getAudioCtx();
  const o=ctx.createOscillator();const g=ctx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(80,t);
  o.frequency.exponentialRampToValueAtTime(35,t+0.15);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  o.connect(g);g.connect(ctx.destination);
  o.start(t);o.stop(t+0.2);
}

// Champions League–style fanfare: three ascending brass calls + final hit
function playFanfareCL(){
  const ctx=getAudioCtx();const now=ctx.currentTime;
  // First phrase: D4 → A4 → D5 (slow, dramatic)
  playBrass(now,293.66,0.35,0.08);        // D4
  playBrass(now+0.35,440,0.35,0.08);      // A4
  playBrass(now+0.7,587.33,0.35,0.08);   // D5
  playTimpani(now+0.7,0.12);
  // Second phrase: F5 → E5 → D5 → A4 (descending)
  playBrass(now+1.1,698.46,0.3,0.07);    // F5
  playBrass(now+1.35,659.25,0.3,0.07);   // E5
  playBrass(now+1.6,587.33,0.3,0.07);    // D5
  playBrass(now+1.85,440,0.3,0.06);      // A4
  // Build-up rumble
  playRumble(now+1.0,1.0,0.04);
  // Final climax: D4-F4-A4-D5 chord (layered)
  playTimpani(now+1.85,0.18);
  playBrass(now+2.0,293.66,0.7,0.06);    // D4
  playBrass(now+2.0,349.23,0.7,0.06);    // F4
  playBrass(now+2.0,440,0.7,0.06);       // A4
  playBrass(now+2.0,587.33,0.7,0.08);    // D5
  // Final stinger
  (function(){
    const o=ctx.createOscillator();const g=ctx.createGain();
    o.type='sine';o.frequency.value=73.42; // D2 low pedal
    g.gain.setValueAtTime(0,now+1.8);
    g.gain.linearRampToValueAtTime(0.1,now+2.0);
    g.gain.exponentialRampToValueAtTime(0.001,now+2.7);
    o.connect(g);g.connect(ctx.destination);
    o.start(now+1.8);o.stop(now+2.7);
  })();
}

// Spin tick — short brass staccato note
function playTickCL(t,pitch){
  const ctx=getAudioCtx();
  const o=ctx.createOscillator();const g=ctx.createGain();
  o.type='triangle';
  o.frequency.value=pitch;
  g.gain.setValueAtTime(0.04,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  o.connect(g);g.connect(ctx.destination);
  o.start(t);o.stop(t+0.06);
}

let soundInterval=null;
let tickCount=0;
async function startLotterySound(){
  const ctx=getAudioCtx();
  if(ctx.state==='suspended')await ctx.resume();
  tickCount=0;
  soundInterval=setInterval(()=>{
    const now=ctx.currentTime;
    const pitch=350+tickCount*4;
    tickCount++;
    playTickCL(now,pitch);
    if(tickCount%6===0)playTimpani(now+0.01,0.07);
    if(tickCount%18===0)playRumble(now,0.6,0.03);
  },80);
}
function stopLotterySound(){
  if(soundInterval){clearInterval(soundInterval);soundInterval=null}
}
async function playRevealSound(){
  const ctx=getAudioCtx();
  if(ctx.state==='suspended')await ctx.resume();
  playFanfareCL();
}

function getAvailableCount(forLevel){
  const sid=getSelectedPatches();const lvl=forLevel||getLevel();let c=0;
  for(const p of PATCHES){if(!sid.includes(p.id))continue;for(const t of p.teams){if(lvl>0&&t.starRating!==lvl)continue;if(!drawnTeams.has(p.id+'::'+t.name))c++}}
  return c;
}

function getAvailableTeams(forLevel){
  const sid=getSelectedPatches();const lvl=forLevel||getLevel();const all=[];
  for(const p of PATCHES){if(!sid.includes(p.id))continue;for(const t of p.teams){if(lvl>0&&t.starRating!==lvl)continue;if(!drawnTeams.has(p.id+'::'+t.name))all.push({team:t.name,patchId:p.id,patchName:p.name,playerCount:t.playerCount,starRating:t.starRating})}}
  return all;
}

async function drawTeams(){
  if(isSpinning)return;
  const num=parseInt(document.getElementById('numDraw').value)||1;
  const lvl=getLevel();
  let available=[];
  if(lvl===0){for(const l of[3,4,5,2,1]){const at=getAvailableTeams(l);if(at.length>=num){available=at;break}}if(available.length===0)available=getAvailableTeams()}
  else available=getAvailableTeams();
  if(available.length===0){alert('No hi ha equips disponibles per sortejar. Reinicia o selecciona patches.');return}
  const count=Math.min(num,available.length);
  const pool=[...available];const picked=[];
  for(let i=0;i<count;i++){const idx=Math.floor(Math.random()*pool.length);picked.push(pool[idx]);pool.splice(idx,1)}
  isSpinning=true;
  await animateSpin(picked);
  for(const p of picked)drawnTeams.add(p.patchId+'::'+p.team);
  renderResults();
  updateTeamListMarkers();
  document.getElementById('numDraw').value=Math.min(parseInt(document.getElementById('numDraw').value)||1,getAvailableCount());
  isSpinning=false;
}

function animateSpin(pickedTeams){
  return new Promise(resolve=>{
    const overlay=document.getElementById('spinOverlay');
    const spinName=document.getElementById('spinName');
    const spinCount=document.getElementById('spinCount');
    const stepsEl=document.getElementById('drawSteps');
    const available=getAvailableTeams();
    overlay.classList.add('active');
    const allNames=available.map(a=>a.team);
    let stepEls=[];
    if(pickedTeams.length>1){
      stepsEl.innerHTML=pickedTeams.map((_,i)=>`<span class="draw-step" id="ds-${i}"></span>`).join('');
      stepEls=pickedTeams.map((_,i)=>document.getElementById('ds-'+i));
    }
    function setBlur(){spinName.classList.add('blur');spinName.classList.remove('reveal')}
    function setReveal(){spinName.classList.remove('blur');spinName.classList.add('reveal')}

    function spinTeam(index){
      return new Promise(res=>{
        const teamName=pickedTeams[index].team;
        const spinDur=2500+Math.random()*4500;
        const start=Date.now();
        let timer;

        function cycle(){
          const elapsed=Date.now()-start;
          spinName.textContent=allNames[Math.floor(Math.random()*allNames.length)];
          setBlur();
          spinName.classList.remove('reveal');
          spinName.classList.add('shake');
          if(elapsed>=spinDur){
            stopLotterySound();
            spinName.textContent=teamName;
            spinName.classList.remove('shake');
            setReveal();
            playRevealSound();
            if(stepEls[index])stepEls[index].className='draw-step done';
            setTimeout(res,900);
            return;
          }
          const p=elapsed/spinDur;
          timer=setTimeout(cycle,40+p*p*300);
        }

        startLotterySound();
        cycle();
      });
    }

    (async()=>{
      for(let i=0;i<pickedTeams.length;i++){
        spinCount.textContent=`Equip ${i+1} de ${pickedTeams.length}`;
        if(stepEls[i])stepEls[i].className='draw-step active';
        await spinTeam(i);
      }
      stopLotterySound();
      setTimeout(()=>{overlay.classList.remove('active');resolve()},1200);
    })();
  });
}

}

function hasSkill(pl,idx){
  if(idx<0)return true;
  if(idx<32)return((pl.sl>>>0)&(1<<idx))!==0;
  return((pl.sh>>>0)&(1<<(idx-32)))!==0;
}
function playerHasAllSkills(pl){
  for(const si of skillFilter){if(!hasSkill(pl,si))return false}
  return true;
}

  runSearch();

}
function runSearch(){
  const r=document.getElementById('searchResults');
  const q=normalize(document.getElementById('searchInput').value).trim();
  doSearch(q,r);
}

let searchData=null,searchRendered=0;
const SEARCH_BATCH=40;
function doSearch(q,resultsEl){
  const patchEl=document.getElementById('searchPatchFilter');const patchFilter=patchEl?patchEl.value:'all';
  const footEl=document.getElementById('searchFootFilter');const footFilter=footEl?footEl.value:'all';
  searchData=TED_DATA.players.filter(p=>normalize(p.n).includes(q)&&(posFilter.size===0||posFilter.has(p.p))&&(patchFilter==='all'||patchId(p.tk)===patchFilter)&&(footFilter==='all'||p.sf===parseInt(footFilter))&&playerHasAllSkills(p));
  searchData.sort((a,b)=>b.o-a.o);
  searchRendered=0;
  const total=searchData.length;
  const countEl=document.getElementById('searchCount');
  countEl.textContent=total>0?`${total} jug.`:'';
  updateSkillArea();
  if(total===0){
    resultsEl.innerHTML=`<div class="no-results">Cap jugador trobat</div>`;
    resultsEl.classList.add('open');
    return;
  }
  resultsEl.innerHTML='';
  resultsEl.classList.add('open');
  appendSearchResults(resultsEl);
}
function appendSearchResults(resultsEl){
  const end=Math.min(searchRendered+SEARCH_BATCH,searchData.length);
  const frag=document.createDocumentFragment();
  for(let i=searchRendered;i<end;i++){
    const p=searchData[i];
    const teamKey=p.tk;
    const teamName=teamKey.split('::')[1];
    const div=document.createElement('div');
    div.className='search-result-item';
    div.onclick=()=>{closeSearchResults();openPlayerModal(teamKey,p.di)};
    const footIcon=p.sf===1?'<span class="sr-foot" style="color:#60a0f0">L</span>':'<span class="sr-foot" style="color:#3a4a3a">R</span>';
    div.innerHTML=`<span class="sr-name">${p.n}</span><span class="sr-pos">${POS_NAMES[p.p]}</span>${footIcon}<span class="sr-team">${teamName}</span><span class="sr-ovr">${p.o}</span>`;
    frag.appendChild(div);
  }
  resultsEl.appendChild(frag);
  searchRendered=end;
  if(end<searchData.length){
    if(!resultsEl._scrollHandler){
      resultsEl._scrollHandler=true;
      resultsEl.addEventListener('scroll',()=>{
        if(resultsEl.scrollTop+resultsEl.clientHeight>=resultsEl.scrollHeight-100)appendSearchResults(resultsEl);
      });
    }
  }
}

function renderStrengths(data){

  const avgs={};
  for(const[k]of statKeys){
    let sum=0;for(const pl of data.players)sum+=pl[k]||0;
    avgs[k]=Math.round(sum/data.players.length);
  }
  const sorted=[...statKeys].sort((a,b)=>avgs[b[0]]-avgs[a[0]]);
  const top3=sorted.slice(0,3);
  const bot3=sorted.slice(-3).reverse();
  const bar=(v,clr)=>{const p=Math.round(v/100*95+5);return`<div class="s-bar"><div class="s-fill" style="width:${p}%;background:${clr}"></div></div>`};
  return`<div class="panel-card"><h3>Fortaleses i Febleses</h3><div class="strength-grid">
    <div class="strength-col"><h4>Fortaleses</h4>${top3.map(s=>`<div class="strength-item"><span class="s-label">${s[1]}</span>${bar(avgs[s[0]],'#3b82f6')}<span class="s-val">${avgs[s[0]]}</span></div>`).join('')}</div>
    <div class="strength-col"><h4>Febleses</h4>${bot3.map(s=>`<div class="strength-item"><span class="s-label">${s[1]}</span>${bar(avgs[s[0]],'#5a7a5a')}<span class="s-val">${avgs[s[0]]}</span></div>`).join('')}</div>

}

function drawFormation(data,teamKey){
  const cid='fc-'+teamKey.replace(/[^a-zA-Z0-9]/g,'_');
  const canvas=document.getElementById(cid);
  if(!canvas)return;
  const W=380,H=490;
  const dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  const pd=14, L=pd,R=W-pd,T=pd,B=H-pd,PW=R-L,PH=B-T;

  ctx.fillStyle='#1a3a1a';
  ctx.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){ctx.fillStyle=i%2===0?'#1e401e':'#1a3a1a';ctx.fillRect(L,T+i*PH/10,PW,PH/10+1)}

  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1.5;
  ctx.strokeRect(L,T,PW,PH);
  ctx.beginPath();ctx.moveTo(L,T+PH/2);ctx.lineTo(R,T+PH/2);ctx.stroke();
  ctx.beginPath();ctx.arc(L+PW/2,T+PH/2,PH*0.12,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(L+PW/2,T+PH/2,3,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fill();
  const paW=PW*0.55,paH=PH*0.16;
  ctx.strokeRect(L+(PW-paW)/2,T,paW,paH);
  ctx.strokeRect(L+(PW-paW)/2,B-paH,paW,paH);
  const gaW=PW*0.24,gaH=PH*0.07;
  ctx.strokeRect(L+(PW-gaW)/2,T,gaW,gaH);
  ctx.strokeRect(L+(PW-gaW)/2,B-gaH,gaW,gaH);
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;
  const gw=PW*0.18;
  ctx.beginPath();ctx.moveTo(L+PW/2-gw/2,B);ctx.lineTo(L+PW/2-gw/2,B+6);ctx.lineTo(L+PW/2+gw/2,B+6);ctx.lineTo(L+PW/2+gw/2,B);ctx.stroke();
  ctx.beginPath();ctx.moveTo(L+PW/2-gw/2,T);ctx.lineTo(L+PW/2-gw/2,T-6);ctx.lineTo(L+PW/2+gw/2,T-6);ctx.lineTo(L+PW/2+gw/2,T);ctx.stroke();

  const starters=data.players.slice(0,11);
  const catCol={gk:'rgba(59,130,246,0.9)',def:'rgba(74,122,217,0.85)',mid:'rgba(80,200,120,0.85)',fwd:'rgba(231,76,60,0.85)'};
  const Y_BANDS=[
    {y:92, pad:50, cen:[0], wide:[]},
    {y:76, pad:28, cen:[1], wide:[2,3]},
    {y:63, pad:30, cen:[4], wide:[]},
    {y:50, pad:20, cen:[5], wide:[6,7]},
    {y:36, pad:25, cen:[8,11], wide:[]},
    {y:22, pad:20, cen:[], wide:[9,10]},
    {y:14, pad:30, cen:[12], wide:[]},
  ];
  const plc=[];

  for(const band of Y_BANDS){
    const cen=[];let lw=null,rw=null;
    for(let i=0;i<starters.length;i++){
      const pos=starters[i].p;
      if(band.cen.includes(pos)) cen.push({player:starters[i],idx:i});
      else if(band.wide.includes(pos)){
        if(pos===2||pos===6||pos===9) lw={player:starters[i],idx:i};
        else rw={player:starters[i],idx:i};
      }
    }
    const total=cen.length+(lw?1:0)+(rw?1:0);
    if(total===0)continue;
    const xs=[];
    if(lw) xs.push({x:8, player:lw.player, idx:lw.idx});
    if(rw) xs.push({x:92, player:rw.player, idx:rw.idx});
    const n=cen.length;
    if(n>0){
      const min=band.pad,max=100-band.pad;
      for(let j=0;j<n;j++){
        const x=n>1?min+j*(max-min)/(n-1):(min+max)/2;
        xs.push({x,player:cen[j].player,idx:cen[j].idx});
      }
    }
    const yBase=band.y;
    for(let j=0;j<xs.length;j++){
      const py=T+yBase/100*PH;
      const px=L+xs[j].x/100*PW;
      const pos=xs[j].player.p;
      let cat;if(pos===0)cat='gk';else if([1,2,3].includes(pos))cat='def';else if([4,5,6,7,8].includes(pos))cat='mid';else cat='fwd';
      plc.push({player:xs[j].player,px,py,cat,pos,idx:xs[j].idx});
    }
  }

  const R2=12;
  for(const p of plc){
    const g=ctx.createRadialGradient(p.px,p.py,R2*0.5,p.px,p.py,R2*2.5);
    g.addColorStop(0,catCol[p.cat].replace('0.85','0.15').replace('0.9','0.15'));
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.px,p.py,R2*2.5,0,Math.PI*2);ctx.fill();
  }
  for(const p of plc){
    ctx.beginPath();ctx.arc(p.px,p.py,R2,0,Math.PI*2);
    ctx.fillStyle=catCol[p.cat];ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1.2;ctx.stroke();

    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 11px monospace';
    ctx.fillText(p.player.s,p.px,p.py-5);
    ctx.font='bold 8px sans-serif';
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.fillText(Math.round(p.player.o),p.px,p.py+7);

    let nm=p.player.n;if(nm.length>11)nm=nm.slice(0,9)+'…';
    ctx.fillStyle='#c8d8c8';ctx.font='10px sans-serif';ctx.textBaseline='top';
    ctx.fillText(nm,p.px,p.py+R2+3);

    ctx.fillStyle='#6a8a6a';ctx.font='8px sans-serif';ctx.textBaseline='top';
    ctx.fillText(POS_NAMES[p.player.p],p.px,p.py+R2+14);
  }

  canvas.style.cursor='pointer';
  function hitPlayer(e){
    const r=canvas.getBoundingClientRect();
    const sx=W/r.width,sy=H/r.height;
    const mx=(e.clientX-r.left)*sx,my=(e.clientY-r.top)*sy;
    let best=-1,bestD=R2+8;
    for(let i=0;i<plc.length;i++){
      const dx=mx-plc[i].px,dy=my-plc[i].py;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<bestD){bestD=d;best=i}
    }
    return best;
  }
  canvas.onmousemove=function(e){const b=hitPlayer(e);canvas.title=b>=0?plc[b].player.n:'';canvas.style.cursor=b>=0?'pointer':'default';};
  canvas.onclick=function(e){const b=hitPlayer(e);if(b>=0)openPlayerModal(teamKey,plc[b].idx);};
  canvas.onmouseleave=function(){canvas.title='';};
}

let squadSort={col:'s',dir:1},squadTeamKey='';
function renderSquad(data,teamKey){
  squadTeamKey=teamKey;
  const sorted=[...data.players];
  const col=squadSort.col;
  sorted.sort((a,b)=>{
    let va,vb;
    switch(col){
      case's':va=a.s;vb=b.s;break;
      case'n':va=a.n.toLowerCase();vb=b.n.toLowerCase();break;
      case'p':va=a.p;vb=b.p;break;
      case'sp':va=a.sp||0;vb=b.sp||0;break;
      case'pa':va=Math.round(((a.lp||0)+(a.lf||0))/2);vb=Math.round(((b.lp||0)+(b.lf||0))/2);break;
      case'de':va=a.dp||0;vb=b.dp||0;break;
      case'co':va=Math.round(((a.bc||0)+(a.tp||0))/2);vb=Math.round(((b.bc||0)+(b.tp||0))/2);break;
      case'sk':va=popcount(a.sh)+popcount(a.sl);vb=popcount(b.sh)+popcount(b.sl);break;
      case'o':va=a.o||0;vb=b.o||0;break;
      default:va=a.s;vb=b.s;
    }
    if(va<vb)return -1*squadSort.dir;
    if(va>vb)return 1*squadSort.dir;
    return 0;
  });
  let html='<div class="panel-card"><h3>Plantilla</h3><div class="squad-table-wrap"><table class="squad-table"><thead><tr>';
  const cols=[{k:'s',l:'#'},{k:'n',l:'Nom'},{k:'p',l:'Pos'},{k:'o',l:'OVR'},{k:'sk',l:'Hab'},{k:'sp',l:'Vel'},{k:'pa',l:'Pas'},{k:'de',l:'Def'},{k:'co',l:'Con'}];
  html+=cols.map(c=>{
    const isSort=squadSort.col===c.k;
    return`<th onclick="sortSquad('${c.k}')" class="${isSort?(squadSort.dir===1?'sort-asc':'sort-desc'):''}">${c.l}<span class="sort-arrow">${isSort?(squadSort.dir===1?'\u25B2':'\u25BC'):'\u25B4\u25BE'}</span></th>`;
  }).join('');
  html+='</tr></thead><tbody>';
  function popcount(n){n=n>>>0;n=n-(n>>>1&0x55555555);n=(n&0x33333333)+(n>>>2&0x33333333);return(n+(n>>>4)&0xF0F0F0F)*0x1010101>>>24}
  sorted.forEach((pl)=>{
    const origIdx=data.players.indexOf(pl);
    const pn=POS_NAMES[pl.p];
    const spd=pl.sp||0;const pas=Math.round((pl.lp+pl.lf)/2);const def=pl.dp||0;const con=Math.round((pl.bc+pl.tp)/2);
    const bar=v=>`<span class="bar"><span class="bar-fill" style="width:${Math.min(v,100)}%"></span></span>`;
    const ovrCls=pl.o>=90?'elite':pl.o>=85?'high':pl.o>=80?'mid':'';
    const nSkills=popcount(pl.sh)+popcount(pl.sl);
    html+=`<tr onclick="openPlayerModal('${teamKey.replace(/'/g,"\\'")}',${origIdx})" class="clickable-player"><td class="s-number">${pl.s}</td><td class="s-name">${pl.n}</td><td class="s-pos">${pn}</td><td class="s-ovr"><span class="badge ${ovrCls}">${Math.round(pl.o)}</span></td><td class="s-skills">${nSkills}</td><td class="s-stat">${bar(spd)}<span class="stat-val">${spd}</span></td><td class="s-stat">${bar(pas)}<span class="stat-val">${pas}</span></td><td class="s-stat">${bar(def)}<span class="stat-val">${def}</span></td><td class="s-stat">${bar(con)}<span class="stat-val">${con}</span></td></tr>`;
  });
  html+='</tbody></table></div>';
  return html;
}

function sortSquad(col){
  if(squadSort.col===col)squadSort.dir*=-1;
  else{squadSort.col=col;squadSort.dir=1}
  if(squadTeamKey&&typeof TED_FULL!=='undefined'&&TED_FULL[squadTeamKey])renderPanel(TED_FULL[squadTeamKey],squadTeamKey);
}

function renderPanel(data,teamKey){
  squadTeamKey=teamKey;
  const c=document.getElementById('panelContent');
  c.innerHTML=renderPanelHeader(data)+renderStrengths(data)+renderFormation(data,teamKey)+renderSquad(data,teamKey);
  drawFormation(data,teamKey);
}

function renderResults(){
  const grid=document.getElementById('resultsGrid');
  const empty=document.getElementById('resultsEmpty');
  grid.innerHTML='';
  const allDrawn=[];
  for(const key of drawnTeams){
    const[pid,team]=key.split('::');
    const patch=PATCHES.find(p=>p.id===pid);
    const td=patch?patch.teams.find(t=>t.name===team):null;
    allDrawn.push({team,patchId:pid,patchName:patch?patch.name:pid,starRating:td?td.starRating:0,playerCount:td?td.playerCount:0,teamKey:td?td.teamKey:''});
  }
  if(allDrawn.length===0){empty.style.display='block';return}
  empty.style.display='none';
  [...allDrawn].reverse().forEach((d,i)=>{
    const card=document.createElement('div');
    card.className='result-card';
    card.onclick=()=>{if(d.teamKey)openTeamDetail(d.teamKey)};
    card.innerHTML=`<div class="team-name">${d.team} <span class="stars" style="font-size:.75rem">${starsStr(d.starRating)}</span></div><div class="team-patch">${d.patchName} · ${d.playerCount} jug.</div><div class="team-number">#${allDrawn.length-i}</div>`;
    card.title=`${d.team} — ${d.patchName} (${starsStr(d.starRating)})`;
    grid.appendChild(card);
  });
}

// --- Player Modal ---
let playerChartInstance=null;
function searchName(n){const parts=n.replace(/['\u2019]/g,'').trim().split(/\s+/);return parts[parts.length-1]}
function openPlayerModal(teamKey,playerIdx){
  const overlay=document.getElementById('playerModalOverlay');
  overlay.classList.add('active');
  document.body.style.overflow='hidden';
  document.getElementById('playerModalContent').innerHTML='<div class="pm-content"><div style="text-align:center;padding:40px;color:#5a7a5a">Carregant…</div></div>';
  loadFullData(teamKey,()=>{
    const team=TED_FULL[teamKey];
    if(!team||!team.players[playerIdx]){document.getElementById('playerModalContent').innerHTML='<div class="pm-content"><p style="text-align:center;color:#5a7a5a;padding:40px">Jugador no trobat</p></div>';return}
    renderPlayerModal(team,team.players[playerIdx]);
  });
}
function closePlayerModal(){
  if(playerChartInstance){playerChartInstance.destroy();playerChartInstance=null}
  document.getElementById('playerModalOverlay').classList.remove('active');
  document.body.style.overflow='';
}
function renderPlayerModal(team,pl){
  const formLabels=['—','\u2193','\u2198','\u2192','\u2197','\u2191','\u2605','\u2605\u2605'];
  const isGK=pl.p===0;
  const secPos=[];
  if(pl.pp!==undefined)for(let i=0;i<13;i++){if(((pl.pp>>>(i*2))&3)>=2&&i!==pl.p)secPos.push(POS_NAMES[i])}
  const wfU=pl.wfU||0,wfA=pl.wfA||0;
  const footDir=pl.sf!==undefined?(pl.sf===1?2:1):wfU; // sf: 0=dretà,1=esquerrà → 2=esq,1=dret; fallback wfU
  const footNames=['—','Dretà','Esquerrà','Ambdós'];
  const footLabel=footNames[footDir]||'?';
  const statKeys=isGK?['ap','bc','tp','lp','lf','fn','pk','cr','sp','ac','jm','pc','bl','st','bw','ag','dp','hd','db','kp','ga','gc','gr','gl','gx']:['ap','bc','tp','lp','lf','fn','pk','cr','sp','ac','jm','pc','bl','st','bw','ag','dp','hd','db','kp'];
  const html=`<div class="pm-content">
    <div class="pm-header">
      <div class="pm-name">${pl.n} <a class="wiki-link" href="https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(searchName(pl.n))}+footballer" target="_blank" rel="noopener" title="Cerca a Wikipedia">W</a><a class="wiki-link" href="https://www.transfermarkt.com/schnellsuche/ergebnis/schnellsuche?query=${encodeURIComponent(searchName(pl.n))}" target="_blank" rel="noopener" title="Cerca a Transfermarkt">T</a></div>
      <div class="pm-pos">${POS_NAMES[pl.p]}${secPos.length?' <span class="pm-pos-sec">'+secPos.join('/')+'</span>':''}</div>
      <div class="pm-ovr">${pl.o||'?'}</div>
    </div>
    <div class="pm-meta">
      <span>${team.teamName}</span>
      <span>${pl.h||'?'} cm</span>
      <span>${pl.w||'?'} kg</span>
      <span title="Cama dominant" class="wf-visual"><span class="wf-foot-icon" style="background:${footDir===2?'#60a0f0':footDir===3?'#f0c040':'#3a4a3a'}">${footLabel[0]}</span><span class="wf-foot-label">${footLabel}</span></span>
      <span>Forma: ${formLabels[pl.f]||'?'}</span>
    </div>
    <div class="pm-chart-area">
      <canvas id="playerRadar"></canvas>
    </div>
    <div style="text-align:center;font-size:.65rem;color:#4a5a4a;margin:-8px 0 12px">Valors 0–100 (màxim observat ~99)</div>
    <div class="pm-stat-grid${isGK?' gk-mode':''}" id="pmStatGrid"></div>
    <div class="pm-skills" id="pmSkills"></div>
  </div>`;
  document.getElementById('playerModalContent').innerHTML=html;
  setTimeout(()=>renderPlayerRadar(pl,isGK),50);
  const grid=document.getElementById('pmStatGrid');
  const catColors={phy:'cat-phy',tec:'cat-tec',men:'cat-men',gk:'cat-gk'};
  for(const k of statKeys){
    const val=pl[k];if(val===undefined)continue;
    const pct=Math.min(val,100);
    const cat=STAT_CATS[k]||'tec';
    const div=document.createElement('div');div.className='pm-stat-row';
    div.innerHTML=`<span class="pm-slabel">${STAT_LABELS[k]||k}</span><div class="pm-strack"><div class="pm-sfill ${catColors[cat]}" style="width:${pct}%"></div></div><span class="pm-sval">${val}</span>`;
    grid.appendChild(div);
  }
  const skillEl=document.getElementById('pmSkills');
  const skills=[];
  for(let i=0;i<32;i++){if((pl.sl>>>0)&(1<<i))skills.push(SKILL_NAMES[i])}
  for(let i=0;i<16;i++){if((pl.sh>>>0)&(1<<i))skills.push(SKILL_NAMES[32+i])}
  if(skills.length>0)skillEl.innerHTML=skills.map(s=>`<span class="skill-tag">${s}</span>`).join('');
  else skillEl.innerHTML='<span style="color:#5a7a5a;font-size:.8rem;font-style:italic">Sense habilitats</span>';
}
function renderPlayerRadar(pl,isGK){
  if(playerChartInstance){playerChartInstance.destroy();playerChartInstance=null}
  const canvas=document.getElementById('playerRadar');
  if(!canvas)return;
  const statKeys=isGK?['ap','bc','tp','lp','lf','fn','pk','cr','sp','ac','jm','pc','bl','st','bw','ag','dp','hd','db','kp','ga','gc','gr','gl','gx']:['ap','bc','tp','lp','lf','fn','pk','cr','sp','ac','jm','pc','bl','st','bw','ag','dp','hd','db','kp'];
  const data=statKeys.map(k=>Math.round(pl[k]||0));
  const labels=statKeys.map(k=>STAT_LABELS[k]||k);
  playerChartInstance=new Chart(canvas,{
    type:'radar',
    data:{
      labels,
      datasets:[{
        label:pl.n,data,
        backgroundColor:'rgba(59,130,246,.12)',
        borderColor:'rgba(59,130,246,.7)',
        borderWidth:2,
        pointBackgroundColor:'rgba(59,130,246,.6)',
        pointBorderColor:'rgba(59,130,246,.3)',
        pointRadius:3,pointHoverRadius:5
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:true,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.parsed.r+' / 100'}}},
      scales:{
        r:{
          beginAtZero:true,max:100,
          ticks:{stepSize:20,color:'rgba(255,255,255,.25)',font:{size:9},backdropColor:'transparent'},
          grid:{color:'rgba(255,255,255,.06)',lineWidth:1},
          angleLines:{color:'rgba(255,255,255,.05)',lineWidth:1},
          pointLabels:{color:'rgba(255,255,255,.4)',font:{size:9}}
        }
      }
    }
  });
}

document.getElementById('panelClose').addEventListener('click',closeTeamPanel);
document.getElementById('teamPanelOverlay').addEventListener('click',function(e){if(e.target===this)closeTeamPanel()});
document.getElementById('playerModalOverlay').addEventListener('click',function(e){if(e.target===this)closePlayerModal()});
document.addEventListener('DOMContentLoaded',init);

function resetAll(){
  if(isSpinning)return;
  drawnTeams.clear();
  renderResults();
  updateTeamListMarkers();
  document.getElementById('numDraw').value=1;
}
</script>
