<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PES 2021 · Football's Coming Home</title>
<style>
  :root{
    --bg-page:#060a06;
    --bg-card:rgba(12,20,12,.85);
    --bg-surface:rgba(8,14,8,.9);
    --bg-surface-alt:rgba(18,28,18,.9);
    --bg-hover:rgba(22,36,22,.95);
    --bg-overlay:rgba(0,0,0,.75);
    --text-primary:#eef6ee;
    --text-secondary:#b8d0b8;
    --text-muted:#6a9a6a;
    --text-dim:#4a7a4a;
    --text-faint:#3a5a3a;
    --accent:#22d3ee;
    --accent-hover:#06b6d4;
    --accent-glow:rgba(34,211,238,.12);
    --accent-glow-3:rgba(34,211,238,.28);
    --accent-soft:rgba(34,211,238,.08);
    --green-pitch:#16a34a;
    --green-pitch-glow:rgba(22,163,74,.15);
    --border:rgba(30,60,30,.5);
    --border-light:rgba(40,70,40,.6);
    --border-hover:rgba(50,100,50,.7);
    --stat-phy:#ef4444;
    --stat-tec:#3b82f6;
    --stat-men:#a78bfa;
    --stat-gk:#22c55e;
    --stat-phy-to:#f87171;
    --stat-tec-to:#60a5fa;
    --stat-men-to:#c4b5fd;
    --stat-gk-to:#4ade80;
    --radius-sm:12px;
    --radius-md:16px;
    --radius-lg:22px;
    --radius-xl:28px;
    --shadow-card:0 4px 24px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
    --shadow-hover:0 12px 40px rgba(0,0,0,.5),0 0 20px var(--accent-glow);
    --shadow-glow:0 0 30px var(--accent-glow),0 0 60px rgba(34,211,238,.05);
    --glass:rgba(12,20,12,.6);
    --glass-border:rgba(40,80,40,.35);
    --font-display:'Oswald',sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-mono:'JetBrains Mono',SFMono-Regular,Consolas,monospace;
  }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--font-body);
    background:var(--bg-page);
    color:var(--text-primary);
    min-height:100vh;
    font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  }
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(34,211,238,.3);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(34,211,238,.5)}

  .pitch-line{
    position:fixed;top:0;left:0;right:0;bottom:0;
    pointer-events:none;z-index:0;
    background:
      repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(22,163,74,.04) 59px,rgba(22,163,74,.04) 60px),
      repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(22,163,74,.02) 59px,rgba(22,163,74,.02) 60px);
  }

  .stadium-glow{
    position:fixed;top:-20%;left:-20%;width:140%;height:140%;
    pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse at 50% 0%,rgba(34,211,238,.03) 0%,transparent 50%),
      radial-gradient(ellipse at 20% 80%,rgba(22,163,74,.025) 0%,transparent 40%),
      radial-gradient(ellipse at 80% 60%,rgba(22,163,74,.02) 0%,transparent 40%);
  }

  .container{max-width:1280px;margin:0 auto;padding:0 28px;position:relative;z-index:1}

  header{
    border-bottom:1px solid var(--border);margin-bottom:32px;
    position:relative
  }
  header::after{
    content:'';position:absolute;bottom:-1px;left:15%;right:15%;
    height:1px;background:linear-gradient(90deg,transparent,var(--accent-glow-3),transparent)
  }
  .header-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:28px 0;flex-wrap:wrap;gap:20px
  }
  .header-left{display:flex;align-items:center;gap:14px}
  .header-left h1{
    font-family:var(--font-display);font-size:2rem;font-weight:700;
    background:linear-gradient(135deg,var(--text-primary) 30%,var(--accent));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    letter-spacing:.5px;text-transform:uppercase
  }
  .header-left .ball{font-size:2rem;filter:drop-shadow(0 0 8px var(--green-pitch-glow))}
  .search-group{display:flex;flex-direction:column;gap:10px;flex:1;max-width:560px;min-width:280px}
  .search-row{display:flex;gap:10px;align-items:stretch}
  .search-box{
    position:relative;flex:1;min-width:0
  }
  .search-filter-bar{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    padding:8px 6px;min-height:0;overflow:hidden;
    transition:all .3s ease
  }
  .search-filter-bar .sf-group{
    display:flex;align-items:center;gap:6px;font-size:.78rem
  }
  .search-filter-bar .sf-group label{
    color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;font-size:.62rem;font-weight:700
  }
  .search-filter-bar select{
    font-size:.75rem;padding:5px 10px;min-width:90px;
    background:var(--bg-surface-alt);border-color:var(--glass-border);border-width:1.5px;border-radius:8px
  }
  .search-filter-bar .sf-count{
    color:var(--accent);font-size:.72rem;margin-left:auto;font-family:var(--font-mono);white-space:nowrap;font-weight:600
  }
  .search-filter-bar .sf-skill-tag{
    background:var(--accent-soft);border:1px solid rgba(34,211,238,.3);border-radius:20px;padding:3px 10px;font-size:.68rem;color:var(--accent);
    display:inline-flex;align-items:center;gap:4px;font-weight:600
  }
  .search-filter-bar .sf-skill-clear{
    background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.75rem;padding:0 3px;font-family:inherit
  }
  .search-filter-bar .sf-skill-clear:hover{color:var(--text-primary)}
  .search-box input{
    width:100%;
    background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1.5px solid var(--glass-border);border-radius:var(--radius-sm);
    padding:12px 16px 12px 40px;color:var(--text-primary);font-size:.9rem;outline:none;
    transition:border-color .25s,box-shadow .25s;font-family:var(--font-body)
  }
  .search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow),var(--shadow-glow)}
  .search-box input::placeholder{color:var(--text-faint)}
  .search-box .s-icon{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    color:var(--text-faint);font-size:.95rem;pointer-events:none
  }
  .search-results{
    position:absolute;top:100%;left:0;right:0;z-index:500;
    background:rgba(12,20,12,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1.5px solid var(--glass-border);border-radius:var(--radius-sm);
    margin-top:8px;max-height:420px;overflow-y:auto;display:none;
    box-shadow:0 16px 48px rgba(0,0,0,.7)
  }
  .search-results.open{display:block}
  .search-result-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;cursor:pointer;transition:background .15s;
    border-bottom:1px solid rgba(30,60,30,.3);font-size:.85rem
  }
  .search-result-item:last-child{border-bottom:none}
  .search-result-item:hover{background:var(--bg-hover)}
  .search-result-item .sr-name{color:var(--text-primary);font-weight:600;min-width:0;font-size:.88rem}
  .search-result-item .sr-ovr{
    font-family:var(--font-mono);color:var(--accent);font-weight:700;font-size:.95rem;width:38px;text-align:right;flex-shrink:0
  }
  .search-result-item .sr-pos{
    color:var(--text-muted);font-size:.72rem;width:34px;flex-shrink:0;text-align:center;
    background:var(--bg-surface-alt);border-radius:6px;padding:2px 5px;font-weight:600
  }
  .search-result-item .sr-team{
    color:var(--text-faint);font-size:.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    flex:1;min-width:0;margin:0 4px;font-style:italic
  }
  .search-result-item .sr-foot{
    width:16px;flex-shrink:0;text-align:center;font-size:.78rem;opacity:.8
  }

  .controls{
    background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-radius:var(--radius-md);padding:24px 28px;margin-bottom:28px;
    border:1.5px solid var(--glass-border);
    box-shadow:var(--shadow-card)
  }
  .controls-row{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end}
  .control-group{flex:1;min-width:170px}
  .control-group label{
    display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--text-dim);margin-bottom:8px;font-weight:700
  }
  .patch-checkboxes{display:flex;flex-direction:column;gap:7px}
  .patch-checkboxes label{
    display:flex;align-items:center;gap:10px;cursor:pointer;
    font-size:.85rem;text-transform:none;letter-spacing:0;color:var(--text-secondary);
    transition:color .15s
  }
  .patch-checkboxes label:hover{color:var(--text-primary)}
  .patch-checkboxes input[type=checkbox]{
    width:16px;height:16px;accent-color:var(--accent);cursor:pointer;
    border-radius:4px
  }
  .patch-checkboxes .count{color:var(--text-faint);font-size:.72rem}
  select{
    background:var(--bg-surface-alt);border:1.5px solid var(--glass-border);border-radius:var(--radius-sm);
    padding:11px 14px;color:var(--text-primary);font-size:.9rem;outline:none;cursor:pointer;
    min-width:110px;transition:border-color .2s,box-shadow .2s;
    font-weight:500;font-family:var(--font-body)
  }
  select:hover{border-color:var(--border-hover)}
  select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  select option{background:var(--bg-surface-alt);color:var(--text-primary);padding:6px}
  .stars{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:20px;height:20px;border-radius:6px;
    font-size:.6rem;font-weight:800;line-height:1;
    padding:0 5px;flex-shrink:0;letter-spacing:.5px
  }
  .stars.s1{background:rgba(100,120,130,.2);color:#8899aa}
  .stars.s2{background:rgba(180,130,60,.2);color:#d4a06a}
  .stars.s3{background:rgba(180,200,220,.15);color:#c8d0e0}
  .stars.s4{background:rgba(250,200,30,.15);color:#facc15;text-shadow:0 0 8px rgba(250,200,30,.3)}
  .stars.s5{background:linear-gradient(135deg,rgba(239,68,68,.25),rgba(168,85,247,.2));color:#f87171;text-shadow:0 0 12px rgba(239,68,68,.35);box-shadow:0 0 16px rgba(239,68,68,.15)}

  input[type=number]{
    background:var(--bg-surface-alt);border:1.5px solid var(--glass-border);border-radius:var(--radius-sm);
    padding:11px 14px;color:var(--text-primary);font-size:.9rem;width:80px;outline:none;
    transition:border-color .2s,box-shadow .2s;font-weight:500;font-family:var(--font-body)
  }
  input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  input[type=number]:hover{border-color:var(--border-hover)}

  .btn{
    padding:11px 28px;border:none;border-radius:var(--radius-sm);font-size:.95rem;font-weight:700;
    cursor:pointer;transition:all .25s ease;display:inline-flex;align-items:center;gap:10px;
    font-family:var(--font-body);letter-spacing:.3px;position:relative;overflow:hidden
  }
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),var(--accent-hover));color:#060a06;
    box-shadow:0 4px 20px var(--accent-glow);font-size:1rem;padding:12px 34px;
    font-weight:800;text-transform:uppercase;letter-spacing:.5px
  }
  .btn-primary:hover:not(:disabled){
    transform:translateY(-2px);box-shadow:0 8px 32px var(--accent-glow-3),var(--shadow-glow)
  }
  .btn-primary:active:not(:disabled){transform:translateY(0)}
  .btn-secondary{
    background:var(--glass);color:var(--text-secondary);
    border:1.5px solid var(--glass-border);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)
  }
  .btn-secondary:hover:not(:disabled){background:var(--bg-hover);color:var(--text-primary);border-color:var(--border-hover)}
  .btn-group{display:flex;gap:12px;align-items:flex-end}

  .results{
    background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-radius:var(--radius-md);padding:28px;margin-bottom:28px;
    border:1.5px solid var(--glass-border);min-height:120px;
    box-shadow:var(--shadow-card)
  }
  .results h2{
    font-family:var(--font-display);font-size:.75rem;text-transform:uppercase;letter-spacing:2px;
    color:var(--text-dim);margin-bottom:16px;font-weight:600
  }
  .results-empty{
    color:var(--text-faint);text-align:center;padding:40px 0;font-style:italic;font-size:.9rem
  }
  .results-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px
  }
  .result-card{
    background:var(--bg-surface);border-radius:var(--radius-sm);padding:18px 20px;cursor:pointer;
    transition:all .3s cubic-bezier(.25,.46,.45,.94);position:relative;
    animation:fadeInUp .5s ease both;
    border-left:3px solid var(--accent);border:1.5px solid var(--glass-border);
    box-shadow:var(--shadow-card);overflow:hidden
  }
  .result-card::before{
    content:'';position:absolute;top:0;left:0;right:0;bottom:0;
    background:linear-gradient(135deg,transparent 60%,var(--accent-soft));pointer-events:none;opacity:0;
    transition:opacity .3s
  }
  .result-card:nth-child(1){animation-delay:0s}
  .result-card:nth-child(2){animation-delay:.08s}
  .result-card:nth-child(3){animation-delay:.16s}
  .result-card:nth-child(4){animation-delay:.24s}
  .result-card:nth-child(5){animation-delay:.32s}
  .result-card:nth-child(6){animation-delay:.4s}
  .result-card:nth-child(7){animation-delay:.48s}
  .result-card:nth-child(8){animation-delay:.56s}
  .result-card:nth-child(9){animation-delay:.64s}
  .result-card:nth-child(10){animation-delay:.72s}
  .result-card:hover{
    transform:translateY(-4px);box-shadow:var(--shadow-hover);
    border-color:var(--accent);border-left-color:var(--accent)
  }
  .result-card:hover::before{opacity:1}
  .result-card .team-name{
    font-size:1.05rem;font-weight:700;color:var(--text-primary);display:flex;align-items:center;gap:8px;min-width:0
  }
  .result-card .team-name-text{
    min-width:0;word-break:break-word;hyphens:auto
  }
  .result-card .team-patch{font-size:.76rem;color:var(--text-muted);margin-top:5px}
  .result-card .team-number{
    position:absolute;top:12px;right:14px;
    font-family:var(--font-mono);font-size:.68rem;color:var(--text-faint)
  }

  .team-lists{margin-top:32px}
  .patch-section{
    background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-radius:var(--radius-sm);margin-bottom:14px;
    border:1.5px solid var(--glass-border);overflow:hidden;
    box-shadow:var(--shadow-card)
  }
  .patch-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 22px;cursor:pointer;user-select:none;transition:background .2s
  }
  .patch-header:hover{background:var(--bg-hover)}
  .patch-header h3{font-size:1rem;font-weight:700;color:var(--text-secondary)}
  .patch-header .meta{display:flex;align-items:center;gap:12px}
  .patch-header .patch-video{
    color:var(--text-faint);font-size:.68rem;text-decoration:none;
    display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
    border:1px solid var(--glass-border);transition:all .2s
  }
  .patch-header .patch-video:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .patch-header .count-badge{
    background:var(--bg-surface-alt);padding:4px 12px;border-radius:20px;font-size:.72rem;
    color:var(--text-muted);border:1px solid var(--glass-border);font-weight:600
  }
  .patch-header .toggle-icon{color:var(--text-faint);font-size:1.1rem;transition:transform .3s ease}
  .patch-header .toggle-icon.open{transform:rotate(180deg)}
  .team-grid{display:none;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;padding:0 22px 18px}
  .team-grid.open{display:grid}
  .team-item{
    padding:8px 12px;border-radius:8px;font-size:.82rem;color:var(--text-muted);
    transition:all .2s ease;cursor:pointer;font-weight:500;
    word-break:break-word;hyphens:auto;line-height:1.35
  }
  .team-item:hover{background:var(--bg-hover);color:var(--text-primary);transform:translateX(3px)}
  .team-item.drawn{color:var(--text-faint);text-decoration:line-through;opacity:.6}
  .team-item.drawn::after{content:" \2713";color:var(--green-pitch)}

  @keyframes fadeInUp{
    from{opacity:0;transform:translateY(16px)}
    to{opacity:1;transform:translateY(0)}
  }

  .spin-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;
    z-index:1000;opacity:0;pointer-events:none;transition:opacity .4s
  }
  .spin-overlay.active{opacity:1;pointer-events:all}
  .spin-overlay .spotlight{
    position:fixed;top:50%;left:50%;width:800px;height:800px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(34,211,238,.12) 0%,transparent 70%);
    pointer-events:none;border-radius:50%
  }
  .spin-box{
    background:rgba(12,20,12,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1.5px solid var(--glass-border);
    border-radius:var(--radius-xl);padding:48px 64px;
    text-align:center;max-width:90vw;position:relative;
    box-shadow:0 0 80px rgba(0,0,0,.6),0 0 40px rgba(34,211,238,.08)
  }
  .spin-box .spinning-label{
    color:var(--text-dim);font-size:.8rem;text-transform:uppercase;letter-spacing:4px;
    font-family:var(--font-display);font-weight:600
  }
  .spin-box .spinning-name{
    font-family:var(--font-display);font-size:2.8rem;font-weight:700;min-height:2em;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-primary);margin:24px 0;transition:all .3s;
    letter-spacing:1px
  }
  .spin-box .spinning-name.blur{filter:blur(6px);opacity:.4;color:var(--text-muted)}
  .spin-box .spinning-name.reveal{
    filter:blur(0);opacity:1;color:var(--text-primary);transform:scale(1);
    text-shadow:0 0 60px rgba(34,211,238,.4),0 0 120px rgba(34,211,238,.15);
    animation:glowPulse 1.2s ease infinite
  }
  @keyframes glowPulse{
    0%,100%{text-shadow:0 0 60px rgba(34,211,238,.4),0 0 120px rgba(34,211,238,.15)}
    50%{text-shadow:0 0 80px rgba(34,211,238,.55),0 0 160px rgba(34,211,238,.2)}
  }
  .spin-box .spinning-name.shake{
    animation:shake .1s ease infinite
  }
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-3px)}
    75%{transform:translateX(3px)}
  }
  .spin-box .spinning-count{
    font-size:.78rem;color:var(--text-faint);font-family:var(--font-mono);margin-top:8px
  }
  .spin-box .draw-step{
    display:inline-block;width:10px;height:10px;border-radius:50%;
    background:var(--text-faint);margin:0 5px;transition:all .3s
  }
  .spin-box .draw-step.active{background:var(--accent);box-shadow:0 0 14px rgba(34,211,238,.5)}
  .spin-box .draw-step.done{background:var(--green-pitch);box-shadow:0 0 10px rgba(22,163,74,.4)}

  .team-panel-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.82);z-index:900;
    display:none;justify-content:flex-end;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)
  }
  .team-panel-overlay.active{display:flex}
  .team-panel{
    width:660px;max-width:96vw;
    background:rgba(10,18,10,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-left:1.5px solid var(--glass-border);
    height:100vh;overflow-y:auto;padding:0;
    animation:slideIn .35s cubic-bezier(.25,.46,.45,.94);
    box-shadow:-10px 0 40px rgba(0,0,0,.5)
  }
  @keyframes slideIn{
    from{transform:translateX(100%);opacity:0}
    to{transform:translateX(0);opacity:1}
  }
  .panel-close{
    position:sticky;top:12px;float:right;margin:14px;
    background:var(--glass);border:1.5px solid var(--glass-border);
    color:var(--text-muted);
    width:34px;height:34px;border-radius:50%;font-size:1.1rem;
    cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;

let audioCtx=null;
function getAudioCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

// Brass-like note with attack/decay envelope
function playBrass(t,freq,dur,vol){
  const ctx=getAudioCtx();
  const o=ctx.createOscillator();const g=ctx.createGain();
  o.type='triangle';
  o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.025);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(ctx.destination);
  o.start(t);o.stop(t+dur);
}

// Low rumble (like orchestral timpani/low strings)
function playRumble(t,dur,vol){
  const ctx=getAudioCtx();
  const o=ctx.createOscillator();const g=ctx.createGain();
  o.type='sawtooth';
  o.frequency.value=55;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+dur*0.3);
  g.gain.linearRampToValueAtTime(0,t+dur);
  const f=ctx.createBiquadFilter();
  f.type='lowpass';f.frequency.value=200;
  o.connect(f);f.connect(g);g.connect(ctx.destination);
  o.start(t);o.stop(t+dur);
}

// "Drum hit" — timpani-like thump
function playTimpani(t,vol){
  const ctx=getAudioCtx();
  const o=ctx.createOscillator();const g=ctx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(80,t);
  o.frequency.exponentialRampToValueAtTime(35,t+0.15);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  o.connect(g);g.connect(ctx.destination);
  o.start(t);o.stop(t+0.2);
}

// Champions League–style fanfare: three ascending brass calls + final hit
function playFanfareCL(){
  const ctx=getAudioCtx();const now=ctx.currentTime;
  // First phrase: D4 → A4 → D5 (slow, dramatic)
  playBrass(now,293.66,0.35,0.08);        // D4
  playBrass(now+0.35,440,0.35,0.08);      // A4
  playBrass(now+0.7,587.33,0.35,0.08);   // D5
  playTimpani(now+0.7,0.12);
  // Second phrase: F5 → E5 → D5 → A4 (descending)
  playBrass(now+1.1,698.46,0.3,0.07);    // F5
  playBrass(now+1.35,659.25,0.3,0.07);   // E5
  playBrass(now+1.6,587.33,0.3,0.07);    // D5
  playBrass(now+1.85,440,0.3,0.06);      // A4
  // Build-up rumble
  playRumble(now+1.0,1.0,0.04);
  // Final climax: D4-F4-A4-D5 chord (layered)
  playTimpani(now+1.85,0.18);
  playBrass(now+2.0,293.66,0.7,0.06);    // D4
  playBrass(now+2.0,349.23,0.7,0.06);    // F4
  playBrass(now+2.0,440,0.7,0.06);       // A4
  playBrass(now+2.0,587.33,0.7,0.08);    // D5
  // Final stinger
  (function(){
    const o=ctx.createOscillator();const g=ctx.createGain();
    o.type='sine';o.frequency.value=73.42; // D2 low pedal
    g.gain.setValueAtTime(0,now+1.8);
    g.gain.linearRampToValueAtTime(0.1,now+2.0);
    g.gain.exponentialRampToValueAtTime(0.001,now+2.7);
    o.connect(g);g.connect(ctx.destination);
    o.start(now+1.8);o.stop(now+2.7);
  })();
}

// Spin tick — short brass staccato note
function playTickCL(t,pitch){
  const ctx=getAudioCtx();
  const o=ctx.createOscillator();const g=ctx.createGain();
  o.type='triangle';
  o.frequency.value=pitch;
  g.gain.setValueAtTime(0.04,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  o.connect(g);g.connect(ctx.destination);
  o.start(t);o.stop(t+0.06);
}

let soundInterval=null;
let tickCount=0;
async function startLotterySound(){
  const ctx=getAudioCtx();
  if(ctx.state==='suspended')await ctx.resume();
  tickCount=0;
  soundInterval=setInterval(()=>{
    const now=ctx.currentTime;
    const pitch=350+tickCount*4;
    tickCount++;
    playTickCL(now,pitch);
    if(tickCount%6===0)playTimpani(now+0.01,0.07);
    if(tickCount%18===0)playRumble(now,0.6,0.03);
  },80);
}
function stopLotterySound(){
  if(soundInterval){clearInterval(soundInterval);soundInterval=null}
}
async function playRevealSound(){

  if(ctx.state==='suspended')await ctx.resume();

}

}

function getSelectedPatches(){return[...document.querySelectorAll('.patch-cb:checked')].map(cb=>cb.value)}

function getAvailableCount(forLevel){
  const sid=getSelectedPatches();const lvl=forLevel||getLevel();let c=0;
  for(const p of PATCHES){if(!sid.includes(p.id))continue;for(const t of p.teams){if(lvl>0&&t.starRating!==lvl)continue;if(!drawnTeams.has(p.id+'::'+t.name))c++}}
  return c;
}

function getAvailableTeams(forLevel){
  const sid=getSelectedPatches();const lvl=forLevel||getLevel();const all=[];
  for(const p of PATCHES){if(!sid.includes(p.id))continue;for(const t of p.teams){if(lvl>0&&t.starRating!==lvl)continue;if(!drawnTeams.has(p.id+'::'+t.name))all.push({team:t.name,patchId:p.id,patchName:p.name,playerCount:t.playerCount,starRating:t.starRating})}}
  return all;
}

async function drawTeams(){
  if(isSpinning)return;
  const num=parseInt(document.getElementById('numDraw').value)||1;
  const lvl=getLevel();
  let available=[];
  if(lvl===0){for(const l of[3,4,5,2,1]){const at=getAvailableTeams(l);if(at.length>=num){available=at;break}}if(available.length===0)available=getAvailableTeams()}
  else available=getAvailableTeams();
  if(available.length===0){alert('No hi ha equips disponibles per sortejar. Reinicia o selecciona patches.');return}
  const count=Math.min(num,available.length);
  const pool=[...available];const picked=[];
  for(let i=0;i<count;i++){const idx=Math.floor(Math.random()*pool.length);picked.push(pool[idx]);pool.splice(idx,1)}
  isSpinning=true;
  await animateSpin(picked);
  for(const p of picked)drawnTeams.add(p.patchId+'::'+p.team);
  renderResults();
  updateTeamListMarkers();
  document.getElementById('numDraw').value=Math.min(parseInt(document.getElementById('numDraw').value)||1,getAvailableCount());
  isSpinning=false;
}

function animateSpin(pickedTeams){
  return new Promise(resolve=>{
    const overlay=document.getElementById('spinOverlay');
    const spinName=document.getElementById('spinName');
    const spinCount=document.getElementById('spinCount');
    const stepsEl=document.getElementById('drawSteps');
    const available=getAvailableTeams();
    overlay.classList.add('active');
    const allNames=available.map(a=>a.team);
    let stepEls=[];
    if(pickedTeams.length>1){
      stepsEl.innerHTML=pickedTeams.map((_,i)=>`<span class="draw-step" id="ds-${i}"></span>`).join('');
      stepEls=pickedTeams.map((_,i)=>document.getElementById('ds-'+i));
    }
    function setBlur(){spinName.classList.add('blur');spinName.classList.remove('reveal')}
    function setReveal(){spinName.classList.remove('blur');spinName.classList.add('reveal')}

    function spinTeam(index){
      return new Promise(res=>{
        const teamName=pickedTeams[index].team;
        const spinDur=2500+Math.random()*4500;
        const start=Date.now();
        let timer;

        function cycle(){
          const elapsed=Date.now()-start;
          spinName.textContent=allNames[Math.floor(Math.random()*allNames.length)];
          setBlur();
          spinName.classList.remove('reveal');
          spinName.classList.add('shake');
          if(elapsed>=spinDur){
            stopLotterySound();
            spinName.textContent=teamName;
            spinName.classList.remove('shake');
            setReveal();
            playRevealSound();
            if(stepEls[index])stepEls[index].className='draw-step done';
            setTimeout(res,900);
            return;
          }
          const p=elapsed/spinDur;
          timer=setTimeout(cycle,40+p*p*300);
        }

        startLotterySound();
        cycle();
      });
    }

    (async()=>{
      for(let i=0;i<pickedTeams.length;i++){
        spinCount.textContent=`Equip ${i+1} de ${pickedTeams.length}`;
        if(stepEls[i])stepEls[i].className='draw-step active';
        await spinTeam(i);
      }
      stopLotterySound();
      setTimeout(()=>{overlay.classList.remove('active');resolve()},1200);
    })();
  });
}

function updateTeamListMarkers(){
  document.querySelectorAll('.team-item').forEach(el=>{const t=el.dataset.team;const p=el.dataset.patch;el.classList.toggle('drawn',drawnTeams.has(p+'::'+t))});
}

function hasSkill(pl,idx){
  if(idx<0)return true;
  if(idx<32)return((pl.sl>>>0)&(1<<idx))!==0;
  return((pl.sh>>>0)&(1<<(idx-32)))!==0;
}
function playerHasAllSkills(pl){
  for(const si of skillFilter){if(!hasSkill(pl,si))return false}
  return true;
}

let searchData=null,searchRendered=0;
const SEARCH_BATCH=40;
function doSearch(q,resultsEl){
  const patchEl=document.getElementById('searchPatchFilter');const patchFilter=patchEl?patchEl.value:'all';
  const footEl=document.getElementById('searchFootFilter');const footFilter=footEl?footEl.value:'all';
  searchData=TED_DATA.players.filter(p=>normalize(p.n).includes(q)&&(posFilter.size===0||posFilter.has(p.p))&&(patchFilter==='all'||patchId(p.tk)===patchFilter)&&(footFilter==='all'||p.sf===parseInt(footFilter))&&playerHasAllSkills(p));
  searchData.sort((a,b)=>b.o-a.o);
  searchRendered=0;
  const total=searchData.length;
  const countEl=document.getElementById('searchCount');
  countEl.textContent=total>0?`${total} jug.`:'';
  updateSkillArea();
  if(total===0){
    resultsEl.innerHTML=`<div class="no-results">Cap jugador trobat</div>`;
    resultsEl.classList.add('open');
    return;
  }
  resultsEl.innerHTML='';
  resultsEl.classList.add('open');
  appendSearchResults(resultsEl);
}
function appendSearchResults(resultsEl){
  const end=Math.min(searchRendered+SEARCH_BATCH,searchData.length);
  const frag=document.createDocumentFragment();
  for(let i=searchRendered;i<end;i++){
    const p=searchData[i];
    const teamKey=p.tk;
    const teamName=teamKey.split('::')[1];
    const div=document.createElement('div');
    div.className='search-result-item';
    div.onclick=()=>{closeSearchResults();openPlayerModal(teamKey,p.di)};
    const footIcon=p.sf===1?'<span class="sr-foot" style="color:#60a0f0">L</span>':'<span class="sr-foot" style="color:#3a4a3a">R</span>';
    div.innerHTML=`<span class="sr-name">${p.n}</span><span class="sr-pos">${POS_NAMES[p.p]}</span>${footIcon}<span class="sr-team">${teamName}</span><span class="sr-ovr">${p.o}</span>`;
    frag.appendChild(div);
  }
  resultsEl.appendChild(frag);
  searchRendered=end;
  if(end<searchData.length){
    if(!resultsEl._scrollHandler){
      resultsEl._scrollHandler=true;
      resultsEl.addEventListener('scroll',()=>{
        if(resultsEl.scrollTop+resultsEl.clientHeight>=resultsEl.scrollHeight-100)appendSearchResults(resultsEl);
      });
    }
  }
}

// Side preference per code: 0 = left, 1 = centre, 2 = right.
const SIDE_OF=[1,1,0,2,1,1,0,2,1,0,2,1,1];
const LEVEL_Y={gk:92,def:74,dmf:60,cmf:47,amf:34,fwd:20};
const LEVEL_ORDER=['gk','def','dmf','cmf','amf','fwd'];
const LEVEL_CAT={gk:'gk',def:'def',dmf:'mid',cmf:'mid',amf:'mid',fwd:'fwd'};
const CAT_COL={gk:'rgba(59,130,246,0.9)',def:'rgba(74,122,217,0.85)',mid:'rgba(80,200,120,0.85)',fwd:'rgba(231,76,60,0.85)'};
const CAT_GLOW={gk:'rgba(59,130,246,0.16)',def:'rgba(74,122,217,0.16)',mid:'rgba(80,200,120,0.16)',fwd:'rgba(231,76,60,0.16)'};

function levelOf(code){return(code>=0&&code<LEVEL_OF.length)?LEVEL_OF[code]:'cmf'}
// Tactic slot codes, one per starter, aligned with data.players[0:n].
function getFormationSlots(data){
  if(Array.isArray(data.formation)&&data.formation.length)return data.formation.slice();
  return data.players.slice(0,11).map(p=>p.p);
}
function formationShape(slots){
  const c={def:0,dmf:0,cmf:0,amf:0,fwd:0};
  slots.forEach(v=>{const l=levelOf(v);if(l!=='gk')c[l]++});
  const parts=[c.def,c.dmf,c.cmf,c.amf,c.fwd].filter(x=>x>0);
  return parts.length?parts.join('-'):'\u2014';
}

function renderFormation(data,teamKey){
  const cid='fc-'+teamKey.replace(/[^a-zA-Z0-9]/g,'_');
  const shape=formationShape(getFormationSlots(data));
  return '<div class="panel-card"><h3>Alineació <span class="formation-shape">'+shape+'</span></h3><canvas id="'+cid+'" class="formation-canvas"></canvas>'+renderBench(data,teamKey)+'</div>';
}

function renderBench(data,teamKey){
  const n=getFormationSlots(data).length;
  const bench=data.players.slice(n);
  if(!bench.length)return'';
  const tk=teamKey.replace(/'/g,"\\'");
  const chips=bench.map((pl,bi)=>`<span class="bench-chip" onclick="openPlayerModal('${tk}',${n+bi})" title="Veure fitxa"><span class="bc-num">${pl.s}</span>${pl.n}<span class="bc-pos">${POS_NAMES[pl.p]}</span></span>`).join('');
  return `<div class="bench-strip"><div class="bench-title">Banqueta (${bench.length})</div><div class="bench-chips">${chips}</div></div>`;
}

function drawFormation(data,teamKey){
  const cid='fc-'+teamKey.replace(/[^a-zA-Z0-9]/g,'_');
  const canvas=document.getElementById(cid);
  if(!canvas)return;
  const W=380,H=490;
  const dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  const pd=14, L=pd,R=W-pd,T=pd,B=H-pd,PW=R-L,PH=B-T;

  // --- Pitch background ---
  ctx.fillStyle='#1a3a1a';
  ctx.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){ctx.fillStyle=i%2===0?'#1e401e':'#1a3a1a';ctx.fillRect(L,T+i*PH/10,PW,PH/10+1)}

  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1.5;
  ctx.strokeRect(L,T,PW,PH);
  ctx.beginPath();ctx.moveTo(L,T+PH/2);ctx.lineTo(R,T+PH/2);ctx.stroke();
  ctx.beginPath();ctx.arc(L+PW/2,T+PH/2,PH*0.12,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(L+PW/2,T+PH/2,3,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fill();
  const paW=PW*0.55,paH=PH*0.16;
  ctx.strokeRect(L+(PW-paW)/2,T,paW,paH);
  ctx.strokeRect(L+(PW-paW)/2,B-paH,paW,paH);
  const gaW=PW*0.24,gaH=PH*0.07;
  ctx.strokeRect(L+(PW-gaW)/2,T,gaW,gaH);
  ctx.strokeRect(L+(PW-gaW)/2,B-gaH,gaW,gaH);
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=3;
  const gw=PW*0.18;
  ctx.beginPath();ctx.moveTo(L+PW/2-gw/2,B);ctx.lineTo(L+PW/2-gw/2,B+6);ctx.lineTo(L+PW/2+gw/2,B+6);ctx.lineTo(L+PW/2+gw/2,B);ctx.stroke();
  ctx.beginPath();ctx.moveTo(L+PW/2-gw/2,T);ctx.lineTo(L+PW/2-gw/2,T-6);ctx.lineTo(L+PW/2+gw/2,T-6);ctx.lineTo(L+PW/2+gw/2,T);ctx.stroke();

  const slots=getFormationSlots(data);
  const n=Math.min(slots.length,data.players.length);
  const starters=data.players.slice(0,n);

  const R2=12;

  // Group starters by pitch level, preserving slot order.
  const groups={gk:[],def:[],dmf:[],cmf:[],amf:[],fwd:[]};
  starters.forEach((pl,i)=>{groups[levelOf(slots[i])].push({player:pl,slot:slots[i],i})});

  const plc=[];
  LEVEL_ORDER.forEach(lv=>{
    const items=groups[lv];
    if(!items.length)return;
    // Order left -> centre -> right using the position code side.
    items.sort((a,b)=>(SIDE_OF[a.slot]-SIDE_OF[b.slot])||(a.i-b.i));
    const k=items.length;
    const range=k<=1?[50,50]:k===2?[38,62]:k===3?[25,75]:k===4?[12,88]:[8,92];
    const step=k>1?(range[1]-range[0])/(k-1):0;
    const y=LEVEL_Y[lv];
    items.forEach((it,j)=>{
      const x=range[0]+step*j;
      plc.push({player:it.player,px:L+x/100*PW,py:T+y/100*PH,cat:LEVEL_CAT[lv],slot:it.slot,idx:it.i});
    });
  });

  // --- Player markers ---
  for(const p of plc){
    const g=ctx.createRadialGradient(p.px,p.py,R2*0.5,p.px,p.py,R2*2.5);
    g.addColorStop(0,CAT_GLOW[p.cat]);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.px,p.py,R2*2.5,0,Math.PI*2);ctx.fill();
  }
  for(const p of plc){
    ctx.beginPath();ctx.arc(p.px,p.py,R2,0,Math.PI*2);
    ctx.fillStyle=CAT_COL[p.cat];ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1.2;ctx.stroke();

    ctx.textAlign='center';
    ctx.fillStyle='#ffffff';ctx.textBaseline='middle';
    ctx.font='bold 11px monospace';
    ctx.fillText(p.player.s,p.px,p.py-5);
    ctx.font='bold 9px sans-serif';
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.fillText(Math.round(p.player.o),p.px,p.py+7);

    let nm=p.player.n;if(nm.length>12)nm=nm.slice(0,10)+'\u2026';
    ctx.fillStyle='#eaf6ea';ctx.font='600 10px sans-serif';ctx.textBaseline='top';
    ctx.fillText(nm,p.px,p.py+R2+3);

    const slotPos=(p.slot>=0&&p.slot<POS_NAMES.length)?POS_NAMES[p.slot]:'?';
    ctx.fillStyle='#c6e0c6';ctx.font='9px sans-serif';ctx.textBaseline='top';
    ctx.fillText(slotPos,p.px,p.py+R2+15);
  }

  canvas.style.cursor='pointer';
  function hitPlayer(e){
    const r=canvas.getBoundingClientRect();
    const sx=W/r.width,sy=H/r.height;
    const mx=(e.clientX-r.left)*sx,my=(e.clientY-r.top)*sy;
    let best=-1,bestD=R2+8;
    for(let i=0;i<plc.length;i++){
      const dx=mx-plc[i].px,dy=my-plc[i].py;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<bestD){bestD=d;best=i}
    }
    return best;
  }
  canvas.onmousemove=function(e){const b=hitPlayer(e);canvas.title=b>=0?plc[b].player.n:'';canvas.style.cursor=b>=0?'pointer':'default';};
  canvas.onclick=function(e){const b=hitPlayer(e);if(b>=0)openPlayerModal(teamKey,plc[b].idx);};
  canvas.onmouseleave=function(){canvas.title='';};
}

const teamChartInstances=new Map();

let squadSort={col:'s',dir:1},squadTeamKey='';
function renderSquad(data,teamKey){
  squadTeamKey=teamKey;
  const sorted=[...data.players];
  const col=squadSort.col;
  sorted.sort((a,b)=>{
    let va,vb;
    switch(col){
      case's':va=a.s;vb=b.s;break;
      case'n':va=a.n.toLowerCase();vb=b.n.toLowerCase();break;
      case'p':va=a.p;vb=b.p;break;
      case'sp':va=a.sp||0;vb=b.sp||0;break;
      case'pa':va=Math.round(((a.lp||0)+(a.lf||0))/2);vb=Math.round(((b.lp||0)+(b.lf||0))/2);break;
      case'de':va=a.dp||0;vb=b.dp||0;break;
      case'co':va=Math.round(((a.bc||0)+(a.tp||0))/2);vb=Math.round(((b.bc||0)+(b.tp||0))/2);break;
      case'sk':va=popcount(a.sh)+popcount(a.sl);vb=popcount(b.sh)+popcount(b.sl);break;
      case'o':va=a.o||0;vb=b.o||0;break;
      default:va=a.s;vb=b.s;
    }
    if(va<vb)return -1*squadSort.dir;
    if(va>vb)return 1*squadSort.dir;
    return 0;
  });
  let html='<div class="panel-card"><h3>Plantilla</h3><div class="squad-table-wrap"><table class="squad-table"><thead><tr>';
  const cols=[{k:'s',l:'#'},{k:'n',l:'Nom'},{k:'p',l:'Pos'},{k:'o',l:'OVR'},{k:'sk',l:'Hab'},{k:'sp',l:'Vel'},{k:'pa',l:'Pas'},{k:'de',l:'Def'},{k:'co',l:'Con'}];
  html+=cols.map(c=>{
    const isSort=squadSort.col===c.k;
    return`<th onclick="sortSquad('${c.k}')" class="${isSort?(squadSort.dir===1?'sort-asc':'sort-desc'):''}">${c.l}<span class="sort-arrow">${isSort?(squadSort.dir===1?'\u25B2':'\u25BC'):'\u25B4\u25BE'}</span></th>`;
  }).join('');
  html+='</tr></thead><tbody>';
  function popcount(n){n=n>>>0;n=n-(n>>>1&0x55555555);n=(n&0x33333333)+(n>>>2&0x33333333);return(n+(n>>>4)&0xF0F0F0F)*0x1010101>>>24}
  sorted.forEach((pl)=>{
    const origIdx=data.players.indexOf(pl);
    const pn=POS_NAMES[pl.p];
    const spd=pl.sp||0;const pas=Math.round((pl.lp+pl.lf)/2);const def=pl.dp||0;const con=Math.round((pl.bc+pl.tp)/2);
    const bar=v=>`<span class="bar"><span class="bar-fill" style="width:${Math.min(v,100)}%"></span></span>`;
    const ovrCls=pl.o>=90?'elite':pl.o>=85?'high':pl.o>=80?'mid':'';
    const nSkills=popcount(pl.sh)+popcount(pl.sl);
    html+=`<tr onclick="openPlayerModal('${teamKey.replace(/'/g,"\\'")}',${origIdx})" class="clickable-player"><td class="s-number">${pl.s}</td><td class="s-name">${pl.n}</td><td class="s-pos">${pn}</td><td class="s-ovr"><span class="badge ${ovrCls}">${Math.round(pl.o)}</span></td><td class="s-skills">${nSkills}</td><td class="s-stat">${bar(spd)}<span class="stat-val">${spd}</span></td><td class="s-stat">${bar(pas)}<span class="stat-val">${pas}</span></td><td class="s-stat">${bar(def)}<span class="stat-val">${def}</span></td><td class="s-stat">${bar(con)}<span class="stat-val">${con}</span></td></tr>`;
  });
  html+='</tbody></table></div>';
  return html;
}

function sortSquad(col){
  if(squadSort.col===col)squadSort.dir*=-1;
  else{squadSort.col=col;squadSort.dir=1}
  if(squadTeamKey&&typeof TED_FULL!=='undefined'&&TED_FULL[squadTeamKey])renderPanel(TED_FULL[squadTeamKey],squadTeamKey);
}

function renderPanel(data,teamKey){
  squadTeamKey=teamKey;
  const c=document.getElementById('panelContent');
  c.innerHTML=renderPanelHeader(data)+renderFormation(data,teamKey)+renderSquad(data,teamKey);
  drawFormation(data,teamKey);
}

function renderResults(){
  const grid=document.getElementById('resultsGrid');
  const empty=document.getElementById('resultsEmpty');
  grid.innerHTML='';
  const allDrawn=[];
  for(const key of drawnTeams){
    const[pid,team]=key.split('::');
    const patch=PATCHES.find(p=>p.id===pid);
    const td=patch?patch.teams.find(t=>t.name===team):null;
    allDrawn.push({team,patchId:pid,patchName:patch?patch.name:pid,starRating:td?td.starRating:0,playerCount:td?td.playerCount:0,teamKey:td?td.teamKey:''});
  }
  if(allDrawn.length===0){empty.style.display='block';return}
  empty.style.display='none';
  [...allDrawn].reverse().forEach((d,i)=>{
    const card=document.createElement('div');
    card.className='result-card';
    card.onclick=()=>{if(d.teamKey)openTeamDetail(d.teamKey)};
    card.innerHTML=`<div class="team-name"><span class="team-name-text" title="${d.team.replace(/"/g,'&quot;')}">${d.team}</span> <span class="stars s${d.starRating}" style="font-size:.75rem">${starsStr(d.starRating)}</span></div><div class="team-patch">${d.patchName} · ${d.playerCount} jug.</div><div class="team-number">#${allDrawn.length-i}</div>`;
    grid.appendChild(card);
  });
}

// --- Player Modal ---
let playerChartInstance=null;
function searchName(n){const parts=n.replace(/['\u2019]/g,'').trim().split(/\s+/);return parts[parts.length-1]}
function openPlayerModal(teamKey,playerIdx){
  const overlay=document.getElementById('playerModalOverlay');
  overlay.classList.add('active');
  document.body.style.overflow='hidden';
  document.getElementById('playerModalContent').innerHTML='<div class="pm-content"><div style="text-align:center;padding:40px;color:#5a7a5a">Carregant…</div></div>';
  loadFullData(teamKey,()=>{
    const team=TED_FULL[teamKey];
    if(!team||!team.players[playerIdx]){document.getElementById('playerModalContent').innerHTML='<div class="pm-content"><p style="text-align:center;color:#5a7a5a;padding:40px">Jugador no trobat</p></div>';return}
    renderPlayerModal(team,team.players[playerIdx]);
  });
}
function closePlayerModal(){
  if(playerChartInstance){playerChartInstance.destroy();playerChartInstance=null}
  document.getElementById('playerModalOverlay').classList.remove('active');
  document.body.style.overflow='';
}
function renderPlayerModal(team,pl){
  const formLabels=['—','\u2193','\u2198','\u2192','\u2197','\u2191','\u2605','\u2605\u2605'];
  const isGK=pl.p===0;
  const secPos=[];
  if(pl.pp!==undefined)for(let i=0;i<13;i++){if(((pl.pp>>>(i*2))&3)>=2&&i!==pl.p)secPos.push(POS_NAMES[i])}
  const wfU=pl.wfU||0,wfA=pl.wfA||0;
  const footDir=pl.sf!==undefined?(pl.sf===1?2:1):wfU; // sf: 0=dretà,1=esquerrà → 2=esq,1=dret; fallback wfU
  const footNames=['—','Dretà','Esquerrà','Ambdós'];
  const footLabel=footNames[footDir]||'?';
  const statKeys=isGK?['ap','bc','tp','lp','lf','fn','pk','cr','sp','ac','jm','pc','bl','st','bw','ag','dp','hd','db','kp','ga','gc','gr','gl','gx']:['ap','bc','tp','lp','lf','fn','pk','cr','sp','ac','jm','pc','bl','st','bw','ag','dp','hd','db','kp'];
  const html=`<div class="pm-content">
    <div class="pm-header">
      <div class="pm-name">${pl.n} <a class="wiki-link wikipedia" href="https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(searchName(pl.n))}+footballer" target="_blank" rel="noopener" title="Obre a Wikipedia">Wiki<span class="ext-icon">&#x2197;</span></a><a class="wiki-link transfermarkt" href="https://www.transfermarkt.com/schnellsuche/ergebnis/schnellsuche?query=${encodeURIComponent(searchName(pl.n))}" target="_blank" rel="noopener" title="Obre a Transfermarkt">TM<span class="ext-icon">&#x2197;</span></a></div>
      <div class="pm-pos">${POS_NAMES[pl.p]}${secPos.length?' <span class="pm-pos-sec">'+secPos.join('/')+'</span>':''}</div>
      <div class="pm-ovr">${pl.o||'?'}</div>
    </div>
    <div class="pm-meta">
      <span>${team.teamName}</span>
      <span>${pl.h||'?'} cm</span>
      <span>${pl.w||'?'} kg</span>
      <span title="Cama dominant" class="wf-visual"><span class="wf-foot-icon" style="background:${footDir===2?'#60a0f0':footDir===3?'#f0c040':'#3a4a3a'}">${footLabel[0]}</span><span class="wf-foot-label">${footLabel}</span></span>
      <span>Forma: ${formLabels[pl.f]||'?'}</span>
    </div>
    <div class="pm-chart-area">
      <canvas id="playerRadar"></canvas>
    </div>
    <div style="text-align:center;font-size:.65rem;color:#4a5a4a;margin:-8px 0 12px">Valors 0–100 (màxim observat ~99)</div>
    <div class="pm-stat-grid${isGK?' gk-mode':''}" id="pmStatGrid"></div>
    <div class="pm-skills" id="pmSkills"></div>
  </div>`;
  document.getElementById('playerModalContent').innerHTML=html;
  setTimeout(()=>renderPlayerRadar(pl,isGK),50);
  const grid=document.getElementById('pmStatGrid');
  const catColors={phy:'cat-phy',tec:'cat-tec',men:'cat-men',gk:'cat-gk'};
  for(const k of statKeys){
    const val=pl[k];if(val===undefined)continue;
    const pct=Math.min(val,100);
    const cat=STAT_CATS[k]||'tec';
    const div=document.createElement('div');div.className='pm-stat-row';
    div.innerHTML=`<span class="pm-slabel">${STAT_LABELS[k]||k}</span><div class="pm-strack"><div class="pm-sfill ${catColors[cat]}" style="width:${pct}%"></div></div><span class="pm-sval">${val}</span>`;
    grid.appendChild(div);
  }
  const skillEl=document.getElementById('pmSkills');
  const skills=[];
  for(let i=0;i<32;i++){if((pl.sl>>>0)&(1<<i))skills.push(SKILL_NAMES[i])}
  for(let i=0;i<16;i++){if((pl.sh>>>0)&(1<<i))skills.push(SKILL_NAMES[32+i])}
  if(skills.length>0)skillEl.innerHTML=skills.map(s=>`<span class="skill-tag">${s}</span>`).join('');
  else skillEl.innerHTML='<span style="color:#5a7a5a;font-size:.8rem;font-style:italic">Sense habilitats</span>';
}
function renderPlayerRadar(pl,isGK){
  if(playerChartInstance){playerChartInstance.destroy();playerChartInstance=null}
  const canvas=document.getElementById('playerRadar');
  if(!canvas)return;
  const statKeys=isGK?['ap','bc','tp','lp','lf','fn','pk','cr','sp','ac','jm','pc','bl','st','bw','ag','dp','hd','db','kp','ga','gc','gr','gl','gx']:['ap','bc','tp','lp','lf','fn','pk','cr','sp','ac','jm','pc','bl','st','bw','ag','dp','hd','db','kp'];
  const data=statKeys.map(k=>Math.round(pl[k]||0));
  const labels=statKeys.map(k=>STAT_LABELS[k]||k);
  playerChartInstance=new Chart(canvas,{
    type:'radar',
    data:{
      labels,
      datasets:[{
        label:pl.n,data,
        backgroundColor:'rgba(59,130,246,.12)',
        borderColor:'rgba(59,130,246,.7)',
        borderWidth:2,
        pointBackgroundColor:'rgba(59,130,246,.6)',
        pointBorderColor:'rgba(59,130,246,.3)',
        pointRadius:3,pointHoverRadius:5
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:true,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.parsed.r+' / 100'}}},
      scales:{
        r:{
          beginAtZero:true,max:100,
          ticks:{stepSize:20,color:'rgba(255,255,255,.25)',font:{size:9},backdropColor:'transparent'},
          grid:{color:'rgba(255,255,255,.06)',lineWidth:1},
          angleLines:{color:'rgba(255,255,255,.05)',lineWidth:1},
          pointLabels:{color:'rgba(255,255,255,.4)',font:{size:9}}
        }
      }
    }
  });
}

document.getElementById('panelClose').addEventListener('click',closeTeamPanel);
document.getElementById('teamPanelOverlay').addEventListener('click',function(e){if(e.target===this)closeTeamPanel()});

function resetAll(){
  if(isSpinning)return;
  drawnTeams.clear();
  renderResults();
  updateTeamListMarkers();
  document.getElementById('numDraw').value=1;
}
